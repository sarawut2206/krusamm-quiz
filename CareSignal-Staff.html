async function mineV(){
  var rn=ROLE_NM[ST.role]||ST.role;
  head("งานของฉัน", isClinician()
    ? "เคสที่ส่งต่อมาถึง"+rn+" — เห็นเฉพาะรายการที่ส่งมาถึงวิชาชีพของท่าน"
    : "เคสที่ท่านรับผิดชอบ และเคสที่ยังไม่มีผู้รับผิดชอบ");
  if(ST.role==="insurer"){
    V.innerHTML='<div class="warnbox"><b>หน้านี้เฉพาะทีมดูแล</b><br>บัญชีบริษัทประกันดูภาพรวมระดับกลุ่มได้ที่เมนู <b>พอร์ตความเสี่ยง</b></div>';
    return;
  }
  V.innerHTML='<div class="empty">กำลังโหลด…</div>';
  var rows=[]; try{ rows=await CSBackend.myWork() }catch(e){}
  head("งานของฉัน", isClinician()?"เคสที่ส่งต่อมาถึง"+rn:"เคสที่ท่านรับผิดชอบ และเคสที่ยังไม่มีผู้รับผิดชอบ", rows.length);

  var now=Date.now();
  var late  = rows.filter(function(r){return r.overdue});
  var today = rows.filter(function(r){return !r.overdue && r.due_at && new Date(r.due_at)-now < 864e5});
  var mine  = rows.filter(function(r){return !r.unclaimed});
  var free  = rows.filter(function(r){return r.unclaimed});
  function dueTxt(r){
    if(!r.due_at) return {t:"ไม่กำหนด",c:"var(--ink3)"};
    var h=(new Date(r.due_at)-now)/36e5;
    /* Math.round ต้องครอบตัวเลข ไม่ใช่ครอบข้อความที่ต่อแล้ว มิฉะนั้นได้ NaN */
    if(h<0){ var a=-h; return {t:"เกิน "+(a>=24?Math.round(a/24)+" วัน":Math.round(a)+" ชม."),c:"var(--c1)"} }
    if(h<24) return {t:"เหลือ "+Math.round(h)+" ชม.",c:"var(--c2)"};
    return {t:"เหลือ "+Math.round(h/24)+" วัน",c:"var(--ink2)"};
  }
  rows.forEach(function(r){r._due=r.due_at?new Date(r.due_at).getTime():null});
  var LVR={urgent:0,decline:1,watch:2,stable:3};

  var html=orgBarHTML()+kpiRow([
    {id:"late",n:late.length,label:"เกินกำหนด",tone:"c1"},
    {id:"today",n:today.length,label:"ครบกำหนดวันนี้",tone:"c2"},
    {id:"mine",n:mine.length,label:"ที่ท่านรับไว้",tone:"brand"},
    {id:"free",n:free.length,label:"ยังไม่มีผู้รับ",tone:"c3"}
  ],WL.mineFilter||null);
  var list=rows;
  if(WL.mineFilter==="late")list=late; else if(WL.mineFilter==="today")list=today;
  else if(WL.mineFilter==="mine")list=mine; else if(WL.mineFilter==="free")list=free;

  html+=dashTable({id:"mine",rows:list,sort:{k:"_due",dir:"asc"},
    empty:rows.length?"ไม่มีงานในกลุ่มนี้":(isClinician()?"ไม่มีงานค้าง — เมื่อผู้ประสานงานส่งเคสมาถึง"+rn+" รายการจะขึ้นที่นี่":"ไม่มีงานค้างในความรับผิดชอบของท่าน — ดูเคสทั้งพอร์ตได้ที่เมนู คิวงาน"),
    rowClass:function(r){return r.overdue?"late":""},
    rowAttr:function(r){return 'data-late="'+(r.overdue?1:0)+'" data-open="'+esc(r.kind)+':'+esc(r.ref_id)+'"'},
    note:"รายการนี้กรองที่ฐานข้อมูลด้วยบัญชีที่ล็อกอิน — ท่านเห็นเฉพาะงานในความรับผิดชอบของท่าน ไม่ใช่การซ่อนไว้ที่หน้าจอ",
    cols:[
      {k:"_due",label:"กำหนด",sortKey:function(r){return r._due},searchKey:function(r){return dueTxt(r).t},
       render:function(r){var d=dueTxt(r);return '<b style="color:'+d.c+'">'+esc(d.t)+'</b><span class="sub">'+esc(thDate(r.due_at).split(" ")[0])+'</span>'}},
      {k:"task",label:"งาน",render:function(r){return esc(r.task||"ทบทวนและดำเนินการ")+(r.unclaimed?' <span class="newtag">ยังไม่มีผู้รับ</span>':'')}},
      {k:"level",label:"ระดับ",w:"110px",sortKey:function(r){return LVR[r.level]==null?9:LVR[r.level]},search:false,render:function(r){return prioPill(r.level)}},
      {k:"pseudonym",label:"รหัส",cls:"id",render:function(r){return esc(r.pseudonym||"—")}},
      {k:"display_name",label:"ผู้เอาประกัน",render:function(r){return esc(r.display_name||"—")}},
      {k:"kind",label:"ชนิด",render:function(r){return r.kind==="referral"?"รายการส่งต่อ":"เคส"}},
      {k:"act",label:"การกระทำ",sort:false,search:false,cls:"act",render:function(r){
        return (r.unclaimed&&r.kind==="referral"?'<button class="pri claim" data-claim="'+esc(r.ref_id)+'">รับเคสนี้</button>':'')+
          '<button data-goopen="'+esc(r.kind)+':'+esc(r.ref_id)+'">'+(r.kind==="case"?"เปิดเคส":"ดูการส่งต่อ")+'</button>';
      }}
    ]});
  V.innerHTML=html; bindOrgBar();

  function rebind(){
    V.querySelectorAll("[data-claim]").forEach(function(b){
      b.addEventListener("click",async function(e){
        e.stopPropagation();
        b.disabled=true; b.textContent="กำลังรับ…";
        try{ await CSBackend.claimReferral(b.dataset.claim); toast("รับเคสแล้ว"); mineV() }
        catch(err){ toast("รับเคสไม่สำเร็จ: "+(err.message||err)); b.disabled=false; b.textContent="รับเคสนี้" }
      });
    });
    V.querySelectorAll("[data-goopen]").forEach(function(el){
      el.addEventListener("click",function(e){e.stopPropagation();
        var v=el.dataset.goopen.split(":");
        if(v[0]==="case") caseDetailV(v[1]); else go("refer");
      });
    });
  }
  bindDash(rebind); rebind();
  V.querySelectorAll(".kpirow [data-f]").forEach(function(b){b.addEventListener("click",function(){
    WL.mineFilter=(WL.mineFilter===b.dataset.f)?null:b.dataset.f; mineV();
  })});
}

function bindInviteUI(reload){
  var mk=document.getElementById("ivMake");
  if(mk)mk.addEventListener("click",async function(){
    var u=(document.getElementById("ivUser").value||"").trim();
    if(!u){ toast("กรอกชื่อผู้ใช้ก่อน"); return }
    mk.disabled=true; mk.textContent="กำลังออกรหัส…";
    try{
      var res=await CSBackend.issueInvite(u,
        document.getElementById("ivRole").value,
        (document.getElementById("ivName").value||"").trim(),
        (document.getElementById("ivNote").value||"").trim(),
        parseInt(document.getElementById("ivDays").value,10)||30);
      /* เก็บไว้ในตัวแปรชั่วคราวเพื่อแสดงต่อ เพราะ reload จะวาดหน้าใหม่ทั้งหน้า */
      ST.lastInvite={u:u,code:res&&res.code};
      toast("ออกรหัสแล้ว");
      if(reload) await reload();
      showLastInvite();
    }catch(e){
      toast("ออกรหัสไม่สำเร็จ: "+(e.message||e));
      mk.disabled=false; mk.textContent="ออกรหัส";
    }
  });
  showLastInvite();
  V.querySelectorAll("[data-revoke]").forEach(function(b){
    b.addEventListener("click",async function(){
      if(!confirm("ยกเลิกรหัสนี้?\nผู้ที่ยังไม่ได้ใช้จะใช้รหัสนี้ไม่ได้อีก"))return;
      b.disabled=true;
      try{ await CSBackend.revokeInvite(b.dataset.revoke); toast("ยกเลิกแล้ว"); usersV() }
      catch(e){ toast("ยกเลิกไม่สำเร็จ: "+(e.message||e)); b.disabled=false }
    });
  });
}

  if(!box||!li||!li.code)return;
  box.innerHTML='<div class="notice" style="margin:14px 0 0;border-color:var(--c4)">'+
    '<b>รหัสสำหรับ '+esc(li.u)+'</b>'+
    '<div style="font-family:var(--mono);font-size:21px;letter-spacing:.08em;margin:10px 0;'+
    'user-select:all">'+esc(li.code)+'</div>'+
    'คัดลอกหรือจดไว้ตอนนี้ — <b>ปิดหน้านี้แล้วจะไม่เห็นรหัสนี้อีก</b> '+
    'ถ้าทำหายให้ยกเลิกใบนี้แล้วออกใบใหม่'+
    '<div class="btnrow"><button class="ok" id="ivCopy">คัดลอกรหัส</button>'+
    '<button class="no" id="ivDone">จดแล้ว ซ่อนรหัส</button></div></div>';
  document.getElementById("ivCopy").addEventListener("click",function(){
    try{ navigator.clipboard.writeText(li.code); toast("คัดลอกแล้ว") }
    catch(e){ toast("คัดลอกไม่ได้ — จดด้วยมือแทน") }
  });
  document.getElementById("ivDone").addEventListener("click",function(){
    ST.lastInvite=null; box.innerHTML="";
  });
}

/* ============================================================
   จัดการข้อมูลในระบบ (เฉพาะผู้ดูแลระบบ)
   ------------------------------------------------------------
   ระบบเก็บข้อมูลสุขภาพของคนจริง จึงต้องมีทางลบที่เห็นได้และตรวจย้อนได้
   ไม่ใช่ต้องเข้าไปพิมพ์คำสั่งที่หลังบ้านซึ่งไม่มีใครรู้ว่าใครลบอะไร

   สามอย่างที่หน้านี้ไม่ยอมให้ทำ และเหตุผล
     · ลบบันทึกตรวจสอบ — ระบบประกาศกับผู้ใช้ว่าแก้ย้อนหลังไม่ได้
       ถ้าผู้ดูแลระบบลบได้ คำประกาศนั้นก็ไม่จริง
     · ลบบัญชีเจ้าหน้าที่ที่เคยลงมือทำงาน — เคสและรายการส่งต่ออ้างถึงว่า
       ใครเป็นคนทำ ลบทิ้งแล้วจะเหลือประวัติที่ไม่มีผู้รับผิดชอบ
       ใช้ "ถอนสิทธิ์" แทน เข้าระบบไม่ได้อีกแต่ประวัติยังอ้างถึงได้

function acctCard(title,rows,isMember){
  if(!rows.length) return '<div class="card"><h3>'+title+'</h3><div class="empty">ไม่มี</div></div>';
  return '<div class="card"><h3>'+title+' ('+rows.length+')</h3>'+
    rows.map(function(a){
      var nm=a.display_name||a.username||"—";
      var n=a.n_assess+a.n_cases+a.n_meds;
      return '<div class="case">'+
        '<div class="top"><b>'+esc(nm)+'</b>'+
        '<span class="who">'+esc(a.username||"ไม่มีชื่อผู้ใช้")+' · '+esc(ROLE_NM[a.role]||a.role)+'</span>'+
        (a.is_self?'<span style="margin-left:auto;font-size:11.5px;color:var(--gold)">บัญชีของท่าน</span>':'')+
        '</div>'+
        '<div class="rowline"><span class="k">ข้อมูลที่ผูกอยู่</span><span class="v">'+
          'ประเมิน '+a.n_assess+' · เคส '+a.n_cases+' · ยา '+a.n_meds+'</span></div>'+
        '<div class="rowline"><span class="k">สร้างเมื่อ</span><span class="v">'+thDate(a.created_at)+'</span></div>'+
        (a.has_history?'<div class="flag">บัญชีนี้เคยลงมือทำงานในระบบ (ส่งต่อ ทบทวน หรือรับเคส) '+
          'จึงลบไม่ได้ เพราะประวัติเหล่านั้นต้องมีผู้รับผิดชอบ</div>':'')+
        (a.is_self?'' :
          '<div class="btnrow" style="flex-wrap:wrap">'+
          (n?'<button class="no" data-purge="'+esc(a.id)+'" data-nm="'+esc(nm)+'" style="flex:1 1 100%">ลบข้อมูลสุขภาพ เก็บบัญชีไว้</button>':'')+
          (isMember?'' :'<button class="no" data-revoke2="'+esc(a.id)+'" data-nm="'+esc(nm)+'" style="flex:1 1 45%">ถอนสิทธิ์</button>')+
          (a.has_history?'' :'<button class="no" data-del="'+esc(a.id)+'" data-nm="'+esc(nm)+'" style="flex:1 1 45%;color:var(--c1)">ลบบัญชีทั้งหมด</button>')+
          '</div>')+
      '</div>';
    }).join("")+'</div>';
}

/* การลบข้อมูลสุขภาพย้อนกลับไม่ได้ จึงให้พิมพ์ชื่อยืนยัน ไม่ใช่แค่กด ตกลง
   กล่อง confirm กดผ่านด้วยความเคยชินได้ง่ายเกินไปสำหรับการกระทำแบบนี้ */
function askExact(word,what){
  var t=prompt(what+"\n\nพิมพ์ \""+word+"\" เพื่อยืนยัน");
  return t!==null && t.trim()===word;
}
function bindDataActions(){
  V.querySelectorAll("[data-purge]").forEach(function(b){
    b.addEventListener("click",async function(){
      if(!askExact("ลบข้อมูล","ลบแบบประเมิน เคส ยา สัญญาณเสี่ยง และคำยินยอมของ "+
        b.dataset.nm+" ทั้งหมด · บัญชียังอยู่ · ย้อนกลับไม่ได้"))return;
      b.disabled=true;
      try{ var c=await CSBackend.purgeMemberData(b.dataset.purge);
        toast("ลบแล้ว "+Object.keys(c).reduce(function(t,k){return t+c[k]},0)+" รายการ"); dataV() }
      catch(e){ toast("ลบไม่สำเร็จ: "+(e.message||e)); b.disabled=false }
    });
  });
  V.querySelectorAll("[data-del]").forEach(function(b){
    b.addEventListener("click",async function(){
      if(!askExact("ลบบัญชี","ลบบัญชี "+b.dataset.nm+" และข้อมูลทั้งหมดของบัญชีนี้ · "+
        "บันทึกตรวจสอบจะยังอยู่ · ย้อนกลับไม่ได้"))return;
      b.disabled=true;
      try{ await CSBackend.deleteAccount(b.dataset.del); toast("ลบบัญชีแล้ว"); dataV() }
      catch(e){ toast(e.message||"ลบไม่สำเร็จ"); b.disabled=false }
    });
  });
  V.querySelectorAll("[data-revoke2]").forEach(function(b){
    b.addEventListener("click",async function(){
      if(!confirm("ถอนสิทธิ์ "+b.dataset.nm+" ?\nบัญชีจะเข้าคอนโซลไม่ได้อีก แต่ประวัติการทำงานยังอยู่ครบ\nคืนสิทธิ์ได้ด้วยการออกรหัสใหม่"))return;
      b.disabled=true;
      try{ await CSBackend.revokeStaff(b.dataset.revoke2); toast("ถอนสิทธิ์แล้ว"); dataV() }
      catch(e){ toast(e.message||"ถอนสิทธิ์ไม่สำเร็จ"); b.disabled=false }
    });
  });
}

async function referV(){
  head("ติดตามการส่งต่อ", isClinician()
    ? "รายการที่ส่งมาถึง"+esc(ROLE_NM[ST.role]||ST.role)+" — ค้างอยู่ขั้นไหนและนานเท่าใด"
    : "ส่งต่อแล้วได้รับบริการจริงหรือยัง — ดูว่าเคสค้างอยู่ขั้นไหนและนานเท่าใด");
  if(ST.role==="insurer"){
    V.innerHTML='<div class="warnbox"><b>หน้านี้เฉพาะทีมดูแล</b><br>บัญชีบริษัทประกันดูได้เฉพาะข้อมูลระดับกลุ่มที่หน้าพอร์ต</div>';
    return;
  }
  V.innerHTML='<div class="empty">กำลังโหลด…</div>';
  /* วิชาชีพเรียกชุดเดียวกัน แต่ RLS ส่งกลับมาเฉพาะรายการที่ส่งถึงวิชาชีพตน
     จึงไม่ต้องกรองซ้ำที่หน้าจอ และแก้โค้ดหน้าเว็บก็ไม่ทำให้เห็นของคนอื่น */
  var rows=[]; try{ rows=await (isClinician()?CSBackend.myReferrals():CSBackend.listReferralQueue()) }catch(e){}
  if(!rows.length){
    V.innerHTML='<div class="card"><div class="empty">ยังไม่มีรายการส่งต่อ</div></div>'+
      '<div class="notice">ระบบเปิดรายการส่งต่อเมื่อ Care Manager กดส่งจากหน้าเคส หรือเมื่อเภสัชกรสรุปว่าควรให้แพทย์ทบทวน</div>';
    return;
  }

  /* ---- ท่อสถานะ: จำนวนคงค้าง + เวลาเฉลี่ยที่ค้างในขั้นนั้น ---- */
  var pipe='<div class="pipe">';
  REF_PIPE.forEach(function(p){
    var inStage=rows.filter(function(r){return r.status===p.k});
    var waits=inStage.map(timeInStage).filter(function(d){return d!==null});
    var avg=waits.length?waits.reduce(function(a,b){return a+b},0)/waits.length:null;
    var late=inStage.filter(function(r){
      var d=timeInStage(r); return REF_LIMIT[p.k]&&d!==null&&d>REF_LIMIT[p.k] }).length;
    pipe+='<div class="pn" data-alert="'+(late?1:0)+'">'+
      '<div class="pl">'+esc(p.nm)+'</div>'+
      '<div class="pv">'+inStage.length+'</div>'+
      '<div class="pt">'+(avg!==null?"ค้างเฉลี่ย "+dayTxt(avg):esc(p.t))+
        (late?' · <b style="color:var(--c1)">เกินกำหนด '+late+'</b>':'')+'</div></div>';
  });
  pipe+='</div>';

  /* ---- แยกตามปลายทาง ---- */
  var byDest={};
  rows.forEach(function(r){
    var d=r.destination||r.referral_type||"อื่น ๆ";
    byDest[d]=byDest[d]||{n:0,done:0,wait:[]};
    byDest[d].n++;
    if(r.status==="completed"||r.status==="outcome_recorded") byDest[d].done++;
    var t=timeInStage(r); if(t!==null) byDest[d].wait.push(t);
  });
  var destHTML='<div class="card"><h3>แยกตามปลายทางที่ส่งต่อ</h3><div class="tblwrap"><table class="tbl">'+
    '<thead><tr><th>ปลายทาง</th><th class="num">ทั้งหมด</th><th class="num">รับบริการแล้ว</th>'+
    '<th class="num">อัตราสำเร็จ</th><th class="num">ค้างเฉลี่ย</th></tr></thead><tbody>';
  Object.keys(byDest).forEach(function(d){
    var v=byDest[d], avg=v.wait.length?v.wait.reduce(function(a,b){return a+b},0)/v.wait.length:null;
    destHTML+='<tr><td>'+esc(DEST_NM[d]||d)+'</td><td class="num">'+v.n+'</td>'+
      '<td class="num">'+v.done+'</td><td class="num">'+Math.round(v.done/v.n*100)+'%</td>'+
      '<td class="num">'+dayTxt(avg)+'</td></tr>';
  });
  destHTML+='</tbody></table></div>'+
    '<p class="tiny">อัตราสำเร็จนับเฉพาะรายการที่บันทึกว่าได้รับบริการแล้ว · ตัวเลขจากข้อมูลที่บันทึกในระบบจริง ไม่ได้จำลอง</p></div>';

  /* ---- ตารางรายการที่ยังไม่ปิด เรียงตามค้างนานสุด ---- */
  var open=rows.filter(function(r){return ["outcome_recorded","declined"].indexOf(r.status)<0});
  open.forEach(function(r){r._wait=timeInStage(r); var lim=REF_LIMIT[r.status]; r._over=!!(lim&&r._wait!==null&&r._wait>lim);
    var pr=r.profiles||{}; r._ps=pr.pseudonym||""; r._nm=pr.display_name||""; r._dest=DEST_NM[r.destination||r.referral_type]||r.destination||r.referral_type||"—";
    var st=REF_PIPE.filter(function(p){return p.k===r.status})[0]; r._st=st?st.nm:(REF_END[r.status]||r.status); r._next=st?st.t:"—"});
  head("ติดตามการส่งต่อ", isClinician()?"รายการที่ส่งมาถึง"+esc(ROLE_NM[ST.role]||ST.role):"ส่งต่อแล้วได้รับบริการจริงหรือยัง", rows.length);
  var listHTML='<div class="wide"><h3 style="margin:4px 0 8px">รายการที่ยังไม่ปิด ('+open.length+')</h3>'+
    dashTable({id:"refer",rows:open,sort:{k:"_wait",dir:"desc"},empty:"ปิดครบทุกรายการ",
      rowClass:function(r){return r._over?"late":""},
      rowAttr:function(r){return 'data-ref="'+esc(r.id)+'"'},
      note:"⚠ = ค้างนานกว่าที่ตั้งไว้สำหรับขั้นนั้น ("+Object.keys(REF_LIMIT).map(function(k){var p=REF_PIPE.filter(function(x){return x.k===k})[0];return (p?p.nm:k)+" "+REF_LIMIT[k]+" วัน"}).join(" · ")+") — เกณฑ์บริหารงาน ไม่ใช่เกณฑ์ทางคลินิก",
      cols:[
        {k:"_ps",label:"รหัส",cls:"id"},
        {k:"_nm",label:"ผู้เอาประกัน"},
        {k:"_dest",label:"ปลายทาง"},
        {k:"_st",label:"ขั้นปัจจุบัน"},
        {k:"_wait",label:"ค้างมาแล้ว",num:true,search:false,render:function(r){return (r._over?'<b style="color:var(--c1)">':'')+dayTxt(r._wait)+(r._over?' ⚠</b>':'')}},
        {k:"_next",label:"งานถัดไป",render:function(r){return esc(r._next)+(r.review?'<span class="sub" style="color:var(--c4)">✓ ส่งผลกลับแล้ว</span>':'')}},
        {k:"act",label:"การกระทำ",sort:false,search:false,cls:"act",render:function(r){
          return (isClinician()&&!r.review?'<button class="pri claim" data-review="'+esc(r.id)+'">เปิดแบบฟอร์มและตอบ</button>':'')+
            '<button class="ghostb" data-doc="'+esc(r.id)+'" style="width:auto;display:inline-block;margin-left:4px;padding:6px 10px;font-size:12px">ดูใบส่งต่อ</button>'}}
      ]})+'</div>';

async function reportsV(){

    return;
  }
  V.innerHTML='<div class="empty">กำลังรวบรวม…</div>';
  var cases=[], refs=[], meds=[];
  try{ cases=await CSBackend.caseQueue() }catch(e){}
  try{ refs =await CSBackend.listReferralQueue() }catch(e){}
  try{ meds =await CSBackend.medReviewQueue() }catch(e){}

  var now=Date.now();
  var open=cases.filter(function(c){return ["stable","closed"].indexOf(c.status)<0});
  var overdue=open.filter(function(c){return c.due_at&&new Date(c.due_at)<now});
  var byLevel={};
  open.forEach(function(c){ byLevel[c.level]=(byLevel[c.level]||0)+1 });
  var refDone=refs.filter(function(r){return ["completed","outcome_recorded"].indexOf(r.status)>=0}).length;

  function tbl(title, rows, note){
    var h='<div class="card"><h3>'+esc(title)+'</h3>';
    if(!rows.length){ h+='<div class="empty" style="padding:14px">ยังไม่มีข้อมูลในรายงานนี้</div>'; }
    else{
      h+='<div class="tblwrap"><table class="tbl"><tbody>';
      rows.forEach(function(r){ h+='<tr><td>'+esc(r[0])+'</td><td class="num">'+esc(String(r[1]))+'</td></tr>' });
      h+='</tbody></table></div>';
    }
    if(note) h+='<p class="tiny">'+note+'</p>';
    return h+'</div>';
  }

  var html='<div class="notice"><b>รายงานเหล่านี้เป็นรายงานการบริหารเคส</b> ไม่ใช่รายงานทางการเงินหรือการเคลม — '+
    'CareSignal ไม่คิดเบี้ย ไม่ออกใบเสร็จ และไม่มีส่วนในการพิจารณาสินไหม</div><div class="cols">';

  html+=tbl("สถานะเคสที่เปิดอยู่", [
    ["เคสเปิดอยู่ทั้งหมด", open.length],
    ["ต้องทบทวนด่วน", byLevel.urgent||0],
    ["ต้องทบทวน", byLevel.decline||0],
    ["เฝ้าสังเกต", byLevel.watch||0],
    ["เกินกำหนดตามที่ตั้งไว้", overdue.length]
  ], "นับจากตาราง care_cases ที่ยังไม่อยู่ในสถานะปิด");

  html+=tbl("เคสแยกตามขั้นของวงจร",
    STAGES.map(function(g){
      return [g.ic+" "+g.nm, open.filter(function(c){return stageOf(c.status).k===g.k}).length];
    }), "ตรงกับการจัดกลุ่มในหน้าคิวงาน");

  html+=tbl("การส่งต่อ", [
    ["รายการส่งต่อทั้งหมด", refs.length],
    ["ได้รับบริการแล้ว", refDone],
    ["อัตราสำเร็จ", refs.length?Math.round(refDone/refs.length*100)+"%":"—"],
    ["ยังไม่ปิด", refs.filter(function(r){return ["outcome_recorded","declined"].indexOf(r.status)<0}).length]
  ], "รายละเอียดรายขั้นดูที่หน้าติดตามการส่งต่อ");

  html+=tbl("การทบทวนยา", [
    ["คำขอทบทวนที่ค้าง", meds.length],
    ["พบยากลุ่มเสี่ยงสูง", meds.filter(function(m){return (m.summary||{}).high>0}).length],
    ["มียาที่ระบบยังไม่รู้จัก", meds.filter(function(m){return (m.summary||{}).unknown>0}).length]
  ], "ยาที่ระบบยังไม่รู้จักคือยานอกฐาน 170 ตัวยา ไม่ได้แปลว่ายานั้นมีปัญหา");

  html+='</div><div class="notice" style="margin-top:4px">รายงานที่ยังทำไม่ได้ในตอนนี้ '+
    '(ผลลัพธ์ก่อน–หลังการดูแล · อัตราการหกล้มซ้ำ · เวลาเฉลี่ยจากสัญญาณถึงการติดต่อครั้งแรก) '+
    'ต้องรอข้อมูลจากการใช้งานจริงในระยะนำร่อง — ระบบจะไม่แสดงตัวเลขที่ยังไม่มีข้อมูลรองรับ</div>';

}

   จะพาผู้เชี่ยวชาญมาที่เคสนั้นโดยตรง ไม่ต้องไล่หาในคิว
   รูปแบบ: ...CareSignal-Staff.html#ref=<รหัสรายการส่งต่อ>

function deepLink(){
  /* รับรหัสสาธิต (0000dem0-…) ด้วย ไม่ใช่เฉพาะเลขฐานสิบหก */
  var m=(location.hash||"").match(/ref=([0-9a-z-]{8,})/i);
  return m?m[1]:null;
}
/* บัญชีบริษัทประกันเห็นเฉพาะภาพรวมระดับกลุ่ม — ซ่อนเมนูรายบุคคลไว้ตั้งแต่แรก
   ไม่ใช่แค่กันตอนกดเข้า เพื่อไม่ให้เข้าใจผิดว่ามีสิทธิ์ */
var NAV_BY_ROLE={
  /* ผู้ประสานงานเห็นทั้งพอร์ตเพราะต้องจัดสรรงานและติดตามภาพรวม */
  care_manager:["ward","mine","queue","refer","meds","port","reports","audit","me"],

  insurer:     ["port","me"],

  pharmacist:  ["mine","refer","meds","me"],

    var vis=0, n=g.nextElementSibling;

/* ตัวเลขงานค้างข้างเมนู — เจ้าหน้าที่เห็นภาระงานโดยไม่ต้องกดเข้าไปดู */
async function navCounts(){

  }, IDLE_MIN*60000);
}
["click","keydown","touchstart","scroll"].forEach(function(ev){

});
