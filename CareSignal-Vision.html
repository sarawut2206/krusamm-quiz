/* ============================================================
   ไฟสถานะ 3 สี + เสียงพูดภาษาไทย + ปรับขนาดตัวอักษร
   ------------------------------------------------------------
   ออกแบบสำหรับผู้สูงอายุ:
   - ไฟวงกลมใหญ่ 3 สี: เขียว=พร้อม/สำเร็จ เหลือง=กำลังเตรียม แดง=ติดปัญหา
   - เสียงพูดไทย (Web Speech API) นับครั้ง บอกสถานะ นับถอยหลัง
   - ปุ่ม ก+ / ก- ปรับขนาดตัวอักษรทั้งแอป จำค่าไว้ถาวร
   ============================================================ */

/* ---------- ไฟสถานะ ---------- */
var STATUS_COLORS={green:"#0E9F6E",yellow:"#F5B93E",red:"#DC2626"};
var STATUS_LAST=null;
function setStatus(color,text,speakText){
  var el=document.getElementById("statusLight");
  var tx=document.getElementById("statusText");
  if(el){
    el.style.background=STATUS_COLORS[color]||STATUS_COLORS.yellow;
    el.style.boxShadow="0 0 0 8px "+(STATUS_COLORS[color]||"#F5B93E")+"33, 0 4px 14px rgba(0,0,0,.3)";
    el.classList.toggle("pulse",color==="yellow");
  }
  if(tx)tx.textContent=text||"";
  /* พูดเฉพาะเมื่อสถานะเปลี่ยน กันเสียงรัวซ้ำ */
  var key=color+"|"+(speakText||text||"");
  if(key!==STATUS_LAST){STATUS_LAST=key; if(speakText!==false)speak(speakText||text)}
}

/* ============================================================
   โหมดกล้องเต็มจอ
   ------------------------------------------------------------
   เรียกตอนเริ่มไปป์ไลน์กล้องทุกตัว: ขยายวิดีโอเต็มหน้าจอ ซ่อน
   ป้ายด้านบน แล้วย้ายแถบตัวเลข/สถานะ/ปุ่มทั้งหมดของหน้านั้น
   ลงมารวมเป็นแถบเดียวด้านล่าง (ข้อกำหนด: บนจอมีแต่ภาพกล้อง)
   camExit() ถูกเรียกใน go() เสมอ จึงไม่มีทางค้างข้ามหน้า
   ============================================================ */
function camFullscreen(){
  if(document.getElementById("camdock"))return;
  var st=document.querySelector(".stage"); if(!st)return;
  document.body.classList.add("camfs");
  /* ต้องย้ายเวทีกล้องขึ้นไปเป็นลูกของ body ตรง ๆ — เพราะคอนเทนเนอร์ .anim
     ใช้ transform ตอนแอนิเมชัน ซึ่งทำให้ position:fixed ยึดกับกล่องนั้นแทน
     viewport แล้ววิดีโอจะไม่เต็มจอ (สูงเป็นศูนย์) */
  st.id="camstage";
  document.body.appendChild(st);
  var dock=document.createElement("div"); dock.className="camdock"; dock.id="camdock";
  var hb=st.querySelector(".hudbot"); if(hb)dock.appendChild(hb);
  var sb=document.getElementById("statusBar"); if(sb)dock.appendChild(sb);
  /* ปุ่มหลักเต็มแถว ปุ่มรองอัดแถวเดียวกัน — แถบล่างจะได้ไม่กินพื้นที่วิดีโอ */
  V.querySelectorAll(".cta").forEach(function(b){dock.appendChild(b)});
  var gh=V.querySelectorAll(".ghostb");
  if(gh.length){
    var row=document.createElement("div"); row.className="btnrow";
    gh.forEach(function(b){row.appendChild(b)});
    dock.appendChild(row);
  }
  document.body.appendChild(dock);
}
/* ย้ายทั้งเวทีกล้องและ "ส่วนควบคุมทั้งหมด" (ไม่ใช่แค่ปุ่ม) ขึ้นเป็นลูกของ body */
function camHalf(controlIds){
  if(document.getElementById("camhalfpane"))return;
  var st=document.querySelector(".stage"); if(!st)return;
  document.body.classList.add("camhalf");
  st.id="camstage"; document.body.appendChild(st);
  var pane=document.createElement("div"); pane.className="camhalfpane"; pane.id="camhalfpane";
  (controlIds||[]).forEach(function(id){
    var el=document.getElementById(id); if(el)pane.appendChild(el);
  });
  var sb=document.getElementById("statusBar"); if(sb)pane.insertBefore(sb,pane.firstChild);
  document.body.appendChild(pane);
  return pane;
}
function camHalfExit(){
  var p=document.getElementById("camhalfpane"); if(p)p.remove();
  var st=document.getElementById("camstage"); if(st)st.remove();
  document.body.classList.remove("camhalf");
}
function camExit(){
  camHalfExit();
  var d=document.getElementById("camdock"); if(d)d.remove();
  var st=document.getElementById("camstage"); if(st)st.remove();
  document.body.classList.remove("camfs");
}
function statusHTML(){
  return '<div id="statusBar" style="display:flex;align-items:center;gap:14px;background:rgba(11,18,32,.78);backdrop-filter:blur(10px);border-radius:18px;padding:12px 16px;margin-top:10px">'+
    '<div id="statusLight" style="width:44px;height:44px;border-radius:50%;flex:none;background:#F5B93E;transition:background .25s"></div>'+
    '<div id="statusText" style="font-size:17px;font-weight:600;color:#fff;line-height:1.45;flex:1">กำลังเตรียมระบบ…</div></div>';
}

/* ---------- เสียงพูดภาษาไทย ---------- */
var VOICE={on:(function(){try{return localStorage.getItem("csv:voice")!=="off"}catch(e){return true}})()};
/* ============================================================
   สั่งงานระยะไกลโดยไม่ใช้เสียง — "ระบบเป็นผู้พูด คนเป็นผู้ยกมือ"
   ------------------------------------------------------------
   ระบบรู้จำเสียง (Web Speech API) ถูกถอดออกทั้งหมดเมื่อ 4 ก.ย. 2569
   ตามคำสั่งเจ้าของระบบ เพราะไม่เสถียร: ภาษาไทยไม่มีชุดถอดความในเครื่อง
   เสียงต้องวิ่งไปเซิร์ฟเวอร์ และในบ้านจริงมีทีวี พัดลม คนคุย ผลคือ
   "พูดแล้วไม่ฟัง" หรือ "ฟังผิดเป็นคำอื่น" ซ้ำ ๆ จนผู้สูงอายุเลิกใช้
   กล้องที่เปิดอยู่แล้วเห็นมือชัดกว่าไมค์ได้ยินเสียงเสมอ และทำงานในเครื่อง

   สิ่งที่ยังอยู่เหมือนเดิม
     · เสียงพูดแนะนำทุกขั้น (speak) และการทวนกลับว่าระบบรับคำสั่งอะไรไป (rcAck)
     · ทุกคำสั่งมีปุ่มบนหน้าจอเสมอ
   สิ่งที่ใช้แทนการพูด
     · ยกมือข้างเดียวค้างไว้ = คำสั่งหลักของขั้นนั้น (บันทึก เริ่ม ผ่าน ต่อไป จบ)
     · ยกสองมือค้างไว้      = คำสั่งตรงข้าม (ไม่ผ่าน ทำใหม่ หยุด)
     · ปุ่มรีโมตบลูทูธ       = คำสั่งหลัก (ดู remoteFire)
   ไม่มีการเปิดไมโครโฟนที่ใดในไฟล์นี้อีกต่อไป
   ============================================================ */
var RC={on:false,last:"",lastAt:0};
/* หน้าทดลองไม่มีโหมดผู้ดูแล — คงประตูเดียวกันกับแอปสมาชิกไว้ ให้ stepBegin/remoteFire
   ผ่านเงื่อนไขเดียวกัน และเปิดโหมดได้ทันทีถ้าต่อสวิตช์ภายหลัง */
var CARER={on:false};
function remoteOK() { return !CARER.on }

/* ชื่อสั้นของคำสั่ง ใช้ทั้งบนป้ายบอกท่าทางและในเสียงทวนกลับ */
var RC_NM={record:"บันทึก",start:"เริ่ม",pass:"ผ่าน",next:"ต่อไป",done:"จบ",
           fail:"ไม่ผ่าน",redo:"ทำใหม่",stop:"หยุด"};
var RC_HELP="ยกมือข้างเดียวค้างไว้หนึ่งวินาที คือคำสั่งหลักของขั้นนั้น เช่น เริ่ม หรือ ผ่าน "+
            "ยกสองมือค้างไว้ คือคำสั่งตรงข้าม เช่น ไม่ผ่าน ทำใหม่ หรือ หยุด "+
            "ทุกคำสั่งมีปุ่มบนหน้าจอด้วย";
/* ทวนกลับทันทีที่รับท่าทาง — ผู้ใช้ยืนห่างจอ ต้องได้ยินว่าระบบรับคำสั่งแล้ว
   ประโยคถัดไปของหน้าจอ (เช่น "เริ่มได้เลย") จะต่อท้าย ไม่ตัดประโยคนี้ทิ้ง
   เพราะ speak() เห็น SPK.hold แล้วไม่ยกเลิกคิว · การกระทำเริ่มทันที ไม่รอเสียง */
function rcAck(cmd){
  var nm=RC_NM[cmd]; if(!nm)return;
  RC.last=nm; RC.lastAt=Date.now();
  SPK.hold=Date.now()+1400;
  speak("รับทราบ "+nm,{force:true});
  rcRender();
}
function normText(t){return String(t||"").replace(/[\s​.,!?ๆฯ]/g,"")}

/* ============================================================
   เครื่องสถานะขั้นตอน — แต่ละหน้าประกาศว่าตอนนี้รับคำสั่งอะไรได้บ้าง
   ------------------------------------------------------------
   spec = {id, cue, hint, quiet, on:{record|start|pass|next|done|fail|redo|stop}}
   cue  = ประโยคที่พูดตอนเข้าขั้นตอน · hint = ประโยคที่ทวนเมื่อเงียบนาน
   ท่าทางและรีโมตดู STEP.on ว่าขั้นนี้รับคำสั่งไหน (stepPrimary / stepSecondary)
   เงียบเกิน 13 วินาที = ทวนสิ่งที่ต้องทำให้อีกครั้ง (มากสุด 2 รอบ)
   เพราะความเงียบทำให้ผู้สูงอายุไม่รู้ว่าระบบรออะไรอยู่
   ============================================================ */
var STEP={id:null,on:null,cue:"",hint:"",quiet:false,t0:0,nudges:0,timer:null};
function stepBegin(spec){
  stepStop();
  /* โหมดผู้ดูแลไม่เปิดรับท่าทางและรีโมต ผู้ดูแลกดปุ่มบนจอแทน แต่ยังพูดบอกขั้นตอน
     เพราะผู้ทดสอบยืนห่างจอและต้องได้ยินว่าต้องทำอะไรต่อ */
  if(typeof remoteOK==="function"&&!remoteOK()){
    if(spec&&spec.cue)speak(spec.cue,{force:true});
    return;
  }
  STEP.id=spec.id; STEP.on=spec.on||{};
  STEP.cue=spec.cue||""; STEP.hint=spec.hint||spec.cue||"";
  STEP.t0=Date.now(); STEP.nudges=0;
  STEP.quiet=!!spec.quiet;
  rcRender();
  if(STEP.cue)speak(STEP.cue,{force:true});
  STEP.timer=setInterval(stepTick,1000);
}
function stepStop(){
  if(STEP.timer){clearInterval(STEP.timer);STEP.timer=null}
  STEP.id=null;STEP.on=null;STEP.cue="";STEP.hint="";STEP.quiet=false;
  rcRender();
}
function stepTick(){
  if(!STEP.id)return;
  /* ไม่ทวนทับตอนระบบกำลังพูดอยู่ และไม่ทวนเกินสองรอบ ไม่งั้นกลายเป็นรบกวน */
  if(STEP.quiet)return;
  if(Date.now()-STEP.t0<13000||STEP.nudges>=2)return;
  if(ttsBusy())return;
  STEP.nudges++; STEP.t0=Date.now();
  speak(STEP.hint,{force:true});
}
/* ระบบกำลังพูดอยู่ไหม — ใช้กันการทวนซ้อนเสียงตัวเอง
   speechSynthesis.speaking ค้างเป็น true ถาวรได้บนบางเครื่อง (บั๊กที่รู้จักกัน)
   จึงเชื่อได้เฉพาะในเพดานเวลาจากรอบพูดล่าสุด */
function ttsBusy(){
  var now=Date.now();
  var speaking=("speechSynthesis" in window&&window.speechSynthesis&&speechSynthesis.speaking);
  return now<SPK.until||(speaking&&now<SPK.until+2500);
}

/* ---- ป้ายบนจอ: ผู้ใช้ต้องเห็นตลอดว่ายกมือตอนนี้แล้วจะเกิดอะไร ---- */
function rcMount(){
  var top=document.querySelector(".hudtop"); if(!top)return;
  if(!document.getElementById("rcbadge")){
    var b=document.createElement("span");
    b.className="hudtag"; b.id="rcbadge";
    top.appendChild(b);
  }
  rcRender();
}
function rcRender(){
  var b=document.getElementById("rcbadge"); if(!b)return;
  if(!RC.on){b.textContent="🙋 ใช้ปุ่มบนจอ";return}
  var got=(RC.last&&Date.now()-RC.lastAt<2500)?" · รับแล้ว: "+RC.last:"";
  var g=(typeof gestureHint==="function")?gestureHint():"";
  b.textContent=(STEP.id&&g)?("🙋 "+g+got):("🙋 ค้างมือไว้ 1 วินาที"+got);
}

/* ---- นับถอยหลังแล้วลงมือเอง โดยยกเลิกได้ทุกเมื่อ ----
   ใช้ร่วมกันทุกหน้าที่กล้องบอกได้ว่าผู้ใช้อยู่ในท่าพร้อมแล้ว
   ต้องยกเลิกได้จริง เพราะผู้ใช้เคยสะท้อนว่าระบบเริ่มทั้งที่ยังไม่พร้อม
   ยกเลิกได้สามทาง: ยกมืออีกครั้ง · กดปุ่มบนจอ · แตะที่ไหนก็ได้ */
var CD={t:null,n:0,fire:null,screen:null,tap:null};
function cdRunning(){return !!CD.t}
function cdCancel(quiet){
  if(!CD.t)return false;
  clearInterval(CD.t); CD.t=null; CD.fire=null;
  if(CD.tap){document.removeEventListener("pointerdown",CD.tap,true);CD.tap=null}
  try{if("speechSynthesis" in window)speechSynthesis.cancel()}catch(e){}
  if(!quiet){SPK.until=0;speak("รอก่อนก็ได้ เมื่อพร้อมค่อยยกมือ",{force:true})}
  return true;
}
function cdStart(opts){
  cdCancel(true);
  CD.screen=opts.screen||S.screen; CD.fire=opts.onFire; CD.n=3;
  var nm={3:"สาม",2:"สอง",1:"หนึ่ง"}, head=opts.text||"พร้อมแล้ว";
  setStatus("green",head+" — เตรียมตัว 3 (แตะจอ หรือยกมืออีกครั้ง เพื่อหยุด)",false);
  speak(head+" เตรียมตัว สาม");
  CD.tap=function(){cdCancel()};
  document.addEventListener("pointerdown",CD.tap,true);
  CD.t=setInterval(function(){
    if(S.screen!==CD.screen){cdCancel(true);return}
    CD.n--;
    if(CD.n>=1){setStatus("green","เตรียมตัว… "+CD.n,false);speak(nm[CD.n]);return}
    var f=CD.fire; cdCancel(true); if(f)try{f()}catch(e){}
  },1000);
}

/* ============================================================
   สั่งงานระยะไกลโดยไม่ต้องพูด
   ------------------------------------------------------------
   ผู้ใช้ยืนห่างจอ 2-3 เมตร กดปุ่มบนจอไม่ถึง ส่วนเสียงต้องวิ่งไปถอดความ
   ที่เซิร์ฟเวอร์จึงไม่นิ่งโดยธรรมชาติ ทั้งสองทางนี้ทำงานในเครื่องล้วน

   ยกมือ    — MediaPipe ส่งตำแหน่งข้อมือมาอยู่แล้ว (จุดที่ 15 และ 16)
              ยกข้อมือข้างใดข้างหนึ่งสูงกว่าหัวไหล่ ค้างไว้ราว 0.7 วินาที
              ที่ต้องค้าง เพราะกันการยกมือผ่าน ๆ ตอนขยับตัวหรือจัดท่า
   ปุ่มรีโมต — รีโมตนำเสนอสไลด์ราคาไม่กี่ร้อยบาทส่งปุ่มลูกศร/PageUp/PageDown
              ซึ่งเบราว์เซอร์รับได้ตามปกติ ถือไว้ในมือแล้วกดได้เลย

   ทั้งสองทางเรียกคำสั่งหลักของขั้นตอนนั้น และเคารพด่านเดียวกัน
   คือถ้ากำลังนับถอยหลังอยู่ ให้ยกเลิกการนับ ไม่ใช่สั่งซ้อน
   ============================================================ */
var WRIST={L:15,R:16};
var HAND={since:0,fired:0,n:0};

/* นับว่าตอนนี้ยกมือสูงกว่าหัวไหล่ฝั่งเดียวกันอยู่กี่ข้าง (y เพิ่มลงล่าง) */
function handsUp(lm){
  if(!lm)return 0;
  var n=0, pairs=[[WRIST.L,LM.LSH],[WRIST.R,LM.RSH]];
  for(var i=0;i<pairs.length;i++){
    var w=lm[pairs[i][0]], s=lm[pairs[i][1]];
    if(!w||!s)continue;
    if(w.visibility!==undefined&&w.visibility<0.6)continue;
    if(s.visibility!==undefined&&s.visibility<0.5)continue;
    /* ต้องสูงกว่าหัวไหล่ชัด ๆ ไม่ใช่แค่เสมอกัน กันมือแกว่งตอนเดิน */
    if(s.y-w.y>0.06)n++;
  }
  return n;
}
/* เก็บไว้ให้โค้ดเดิมที่ถามแค่ว่า "ยกมือไหม" ยังใช้ได้ */
function handRaised(lm){return handsUp(lm)>0}

/* คำสั่งหลักของขั้นตอนที่กำลังรออยู่ = ยกมือข้างเดียว */
function stepPrimary(){
  if(!STEP.id||!STEP.on)return null;
  var order=["record","start","pass","next"];
  for(var i=0;i<order.length;i++)if(STEP.on[order[i]])return order[i];
  return null;
}
/* คำสั่งตรงข้ามของขั้นตอนนั้น = ยกสองมือ
   ไม่ผ่าน มาก่อน ทำใหม่ มาก่อน หยุด เพราะเจาะจงกว่าตามลำดับ */
function stepSecondary(){
  if(!STEP.id||!STEP.on)return null;
  var order=["fail","redo","stop"];
  for(var i=0;i<order.length;i++)if(STEP.on[order[i]])return order[i];
  return null;
}
/* ชื่อท่าทางที่ใช้ได้ตอนนี้อยู่ใน RC_NM ไว้แสดงบนจอให้ผู้ใช้รู้ว่าทำอะไรได้บ้าง */
function gestureHint(){
  var a=stepPrimary(), b=stepSecondary(), out=[];
  if(a)out.push("ยกมือ = "+(RC_NM[a]||a));
  if(b)out.push("ยกสองมือ = "+(RC_NM[b]||b));
  return out.join(" · ");
}

function remoteFire(how,k){
  /* กำลังนับถอยหลังอยู่ = สั่งอีกทีแปลว่าขอหยุดก่อน ไม่ใช่สั่งซ้อน */
  if(cdRunning()){cdCancel();return "cancel"}
  if(!k)k=stepPrimary();
  if(!k||!STEP.on||!STEP.on[k])return null;
  var now=Date.now();
  if(now-(HAND.fired||0)<1500)return null;   /* กันสั่งรัวจากเฟรมติด ๆ กัน */
  HAND.fired=now;
  STEP.t0=now; STEP.nudges=0;
  if(typeof rcAck==="function")rcAck(k);      /* ทวนกลับก่อน แล้วลงมือทันที */
  try{STEP.on[k]()}catch(e){}
  return how+":"+k;
}

/* เรียกจากลูปกล้องทุกเฟรม
   จำนวนมือต้องคงที่ครบ 800 มิลลิวินาทีถึงนับเป็นคำสั่ง
   พอจำนวนเปลี่ยน ตัวจับเวลาเริ่มใหม่ คนที่ตั้งใจยกสองมือแต่ยกไม่พร้อมกัน
   จึงไม่ถูกอ่านเป็นคำสั่งมือเดียวไปก่อน */
function gestureTick(lm){
  if(!STEP.id){HAND.n=0;HAND.since=0;return}
  var n=handsUp(lm);
  if(n!==HAND.n){HAND.n=n;HAND.since=n?Date.now():0;return}
  if(!n||!HAND.since)return;
  if(Date.now()-HAND.since<800)return;
  HAND.since=0;
  remoteFire(n===1?"hand1":"hand2", n===1?stepPrimary():stepSecondary());
}

/* ปุ่มจากรีโมต Bluetooth — รับเฉพาะปุ่มที่รีโมตนำเสนอส่งกันบ่อย
   และเลี่ยงปุ่มที่หน้าเว็บใช้อยู่ (Tab, Escape) กับตอนที่ผู้ใช้กำลังพิมพ์ */
var REMOTE_KEYS={PageDown:1,PageUp:1,ArrowRight:1,ArrowLeft:1,ArrowUp:1,ArrowDown:1,
                 Enter:1," ":1,MediaPlayPause:1,AudioVolumeUp:1};
document.addEventListener("keydown",function(e){
  if(!STEP.id)return;
  var t=e.target, tag=t&&t.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(t&&t.isContentEditable))return;
  /* รับทั้งปุ่มมาตรฐานที่รีโมตนำเสนอส่งกันบ่อย และปุ่มที่ผู้ใช้สอนไว้เอง */
  if(!REMOTE_KEYS[e.key]&&!remoteKeyMatch(e))return;
  if(remoteFire("key")){e.preventDefault()}
});

/* ---- สอนปุ่มรีโมตให้ระบบรู้จัก ----
   รีโมตชัตเตอร์ราคาถูกแต่ละรุ่นส่งปุ่มไม่เหมือนกัน บางรุ่นส่ง Enter
   บางรุ่นส่ง Volume Up ซึ่ง Android ไม่ส่งต่อให้หน้าเว็บเลย เดาแทนผู้ใช้ไม่ได้
   จึงให้กดปุ่มจริงแล้วดูว่าเบราว์เซอร์ได้รับอะไร แล้วจำค่านั้นไว้ */
function remoteKeySaved(){
  try{return localStorage.getItem("cs:rkey")||""}catch(e){return ""}
}
function remoteKeyMatch(e){
  var k=remoteKeySaved();
  if(!k)return false;
  return e.key===k||e.code===k;
}
function remoteLearn(){
  var got=null, done=false;
  function onKey(ev){
    if(done)return;
    /* ปุ่มที่ระบบใช้ปิดกล่องอยู่แล้ว ไม่เอามาเป็นปุ่มรีโมต */
    if(ev.key==="Escape"||ev.key==="Tab")return;
    ev.preventDefault(); ev.stopPropagation();
    got=ev.key===" "?" ":(ev.key||ev.code);
    var lab=document.getElementById("rkGot");
    if(lab)lab.textContent="ได้รับปุ่ม: "+(got===" "?"Space":got);
    var ok=document.getElementById("dlgOk");
    if(ok){ok.textContent="จำปุ่มนี้ไว้";ok.disabled=false}
  }
  document.addEventListener("keydown",onKey,true);
  dialog({
    title:"สอนปุ่มรีโมตให้ระบบรู้จัก",
    body:'กดปุ่มบนรีโมตของท่าน<b>หนึ่งครั้ง</b>ตอนนี้'+
         '<br><span id="rkGot" style="display:inline-block;margin-top:10px;font-size:17px;color:#2563EB">ยังไม่ได้รับสัญญาณ…</span>'+
         '<br><span style="font-size:15.5px;color:#8090AA">ถ้ากดแล้วยังขึ้นว่ายังไม่ได้รับ แปลว่ารีโมตรุ่นนี้ส่งปุ่มเสียง '+
         'ซึ่งเบราว์เซอร์ไม่ได้รับ ใช้กับแอปนี้ไม่ได้ — ต้องใช้รีโมตนำเสนอสไลด์แทน</span>',
    ok:"รอกดปุ่ม…",cancel:"ปิด",
    onOk:function(){
      done=true; document.removeEventListener("keydown",onKey,true);
      if(!got){toast("ยังไม่ได้รับปุ่มจากรีโมต");return}
      try{localStorage.setItem("cs:rkey",got)}catch(e){}
      toast("จำปุ่มรีโมตแล้ว — ใช้กดแทนการยกมือได้เลย");
      audit("ตั้งค่าปุ่มรีโมต","ผู้ใช้สอนปุ่ม "+(got===" "?"Space":got)+" ให้ใช้แทนการยกมือ");
      render();
    },
    onCancel:function(){done=true;document.removeEventListener("keydown",onKey,true)}
  });
  var ok=document.getElementById("dlgOk");
  if(ok)ok.disabled=true;
}
function remoteForget(){
  try{localStorage.removeItem("cs:rkey")}catch(e){}
  toast("ลืมปุ่มรีโมตแล้ว");render();
}

/* ============================================================
   โมดูลเรดาร์คลื่นมิลลิเมตร (mmWave) — วัดสมรรถภาพโดยไม่ต้องใช้กล้อง
   ------------------------------------------------------------
   ใช้กับโมดูล HLK-LD2410 (24GHz FMCW) ต่อผ่านเกตเวย์ที่ส่งข้อมูลมาทาง
   WebSocket ซึ่งเป็นสถาปัตยกรรมเดียวกับที่ García-Gutiérrez และคณะ
   (Sensors 2026;26:681) ใช้ในบ้านพักคนชราจริง

   สิ่งที่โมดูลส่งมาต่อเฟรม
     d  ระยะของเป้าหมายที่กำลังเคลื่อนไหว หน่วยเซนติเมตร
     e  พลังงานการเคลื่อนไหว 0-100
     sd ระยะของเป้าหมายที่อยู่นิ่ง หน่วยเซนติเมตร
     se พลังงานของเป้าหมายที่อยู่นิ่ง 0-100

   ข้อจำกัดที่ต้องประกาศไว้ เพราะมีผลต่อการตีความผลโดยตรง
     * เรดาร์ตัวนี้ไม่มีความละเอียดเชิงมุม รู้แค่ว่าไกลเท่าไร ไม่รู้ว่าอยู่ทางไหน
       การวัดความเร็วเดินจึงต้องเดินตรงเข้าหาหรือออกจากเรดาร์เท่านั้น
       ถ้าเดินเฉียง ค่าที่ได้จะต่ำกว่าความจริงตามโคไซน์ของมุม
     * การลุกนั่งเป็นการเคลื่อนที่แนวดิ่ง ส่วนเรดาร์วัดระยะแนวราบ จึงนับจำนวน
       ครั้งจากจังหวะพลังงานที่ขึ้นลงเป็นคาบ ไม่ได้วัดว่าลุกขึ้นสูงแค่ไหน
     * ท่าทรงตัวจับ "ก้าวเท้าออกจากท่า" จากระยะที่กระโดดและพลังงานที่พุ่ง
       ซึ่งเป็นตัวแทนของเกณฑ์ CDC STEADI ที่ถามว่ายืนครบ 10 วินาทีหรือไม่
       แต่ยืนยันไม่ได้ว่าวางเท้าถูกท่าตั้งแต่แรก ต้องให้กล้องหรือคนตรวจ
     * ผลจากเรดาร์ยังไม่เคยวัดคู่ขนานกับนักกายภาพบำบัด จึงต้องแสดงที่มาเสมอ
       และห้ามนำไปแทนผลจากกล้องโดยไม่บอกผู้ใช้

   ตัววิเคราะห์ทั้งสี่เขียนเป็นฟังก์ชันบริสุทธิ์ รับอาร์เรย์เฟรมแล้วคืนผล
   จึงทดสอบได้ครบโดยไม่ต้องมีฮาร์ดแวร์ และเปลี่ยนแหล่งข้อมูลได้ในอนาคต
   ============================================================ */
var RADAR={ws:null,url:"",on:false,live:false,sim:null,frames:[],err:"",onFrame:null};

function radarUrl(){
  try{return localStorage.getItem("cs:radar")||""}catch(e){return ""}
}
function radarSaveUrl(u){
  try{ if(u)localStorage.setItem("cs:radar",u); else localStorage.removeItem("cs:radar"); }catch(e){}
}
function radarDisconnect(){
  if(RADAR.sim){clearInterval(RADAR.sim);RADAR.sim=null}
  try{ if(RADAR.ws)RADAR.ws.close(); }catch(e){}
  RADAR.ws=null;RADAR.on=false;RADAR.live=false;
}
function radarConnect(url,cb){
  radarDisconnect();
  RADAR.url=url||radarUrl(); RADAR.err="";
  if(!RADAR.url){RADAR.err="ยังไม่ได้ตั้งที่อยู่เกตเวย์";if(cb)cb(false);return false}
  if(typeof WebSocket==="undefined"){RADAR.err="เบราว์เซอร์นี้ต่อ WebSocket ไม่ได้";if(cb)cb(false);return false}
  try{
    RADAR.ws=new WebSocket(RADAR.url);
    RADAR.ws.onopen=function(){RADAR.on=true;if(cb)cb(true)};
    RADAR.ws.onmessage=function(ev){radarIngest(ev.data)};
    RADAR.ws.onerror=function(){RADAR.err="ต่อเกตเวย์ไม่สำเร็จ"};
    RADAR.ws.onclose=function(){RADAR.on=false;RADAR.live=false};
    return true;
  }catch(e){RADAR.err="ต่อเกตเวย์ไม่สำเร็จ";if(cb)cb(false);return false}
}
/* รับข้อมูลดิบ — รองรับทั้งชื่อฟิลด์ยาวของ RoomSense IQ และชื่อย่อ
   เพราะเกตเวย์แต่ละเจ้าตั้งชื่อไม่เหมือนกัน และเราคุมฝั่งนั้นไม่ได้ */
function radarIngest(raw){
  var o;
  try{ o=(typeof raw==="string")?JSON.parse(raw):raw; }catch(e){ return null }
  if(!o||typeof o!=="object")return null;
  function num(v){ var n=Number(v); return isFinite(n)?n:null }
  function pick(a,b,c){ return o[a]!=null?o[a]:(o[b]!=null?o[b]:o[c]) }
  var f={ t:(o.t!=null?Number(o.t):Date.now()),
          d:num(pick("d","moving_distance","movingDistance")),
          e:num(pick("e","moving_energy","movingEnergy")),
          sd:num(pick("sd","still_distance","stillDistance")),
          se:num(pick("se","still_energy","stillEnergy")) };
  if(f.d==null&&f.sd==null)return null;
  RADAR.live=true;
  RADAR.frames.push(f);
  if(RADAR.frames.length>3000)RADAR.frames.shift();
  if(RADAR.onFrame)try{RADAR.onFrame(f)}catch(e){}
  return f;
}
function radarClear(){
  RADAR.frames=[];
  /* ธงมีสัญญาณสด ต้องล้างพร้อมเฟรม ไม่งั้นการวัดรอบถัดไปเข้าใจผิด
     ว่ายังมีของจริงส่งอยู่ แล้วไม่ยอมเริ่มตัวจำลอง (บั๊กที่เจอตอนรันครบวงจร) */
  if(!RADAR.ws)RADAR.live=false;
}

/* ============================================================
   ตัววิเคราะห์ทั้งสี่ — ฟังก์ชันบริสุทธิ์ ทดสอบได้โดยไม่ต้องมีฮาร์ดแวร์
   ============================================================ */

/* หาช่วงที่เดินจริง: พลังงานเกินเกณฑ์ และระยะเปลี่ยนไปทางเดียวกันต่อเนื่อง
   ถ้าเปลี่ยนทิศถือว่าจบช่วงเดิน ไม่เอามารวมกัน ไม่งั้นระยะสุทธิจะหักล้างกัน
   จนความเร็วที่คำนวณได้ต่ำกว่าความจริงมาก */
function radarWalk(fr,minE){
  minE=minE||20;
  var best=null,cur=null,i,f,delta,dir;
  function keep(){ if(cur&&(!best||(cur.b-cur.a)>(best.b-best.a)))best=cur }
  for(i=0;i<fr.length;i++){
    f=fr[i];
    /* พลังงานตก = จบช่วงเดิน ต้องเก็บช่วงที่จบไปเทียบก่อนทิ้ง
       ไม่งั้นช่วงเดินที่ตามด้วยการยืนนิ่งจะหายไปทั้งช่วง */
    if(f.d==null||f.e==null||f.e<minE){ keep(); cur=null; continue }
    if(!cur){ cur={a:i,b:i,dir:0}; continue }
    delta=f.d-fr[cur.b].d;
    dir=delta>0?1:(delta<0?-1:0);
    if(cur.dir===0&&dir!==0)cur.dir=dir;
    if(cur.dir!==0&&dir!==0&&dir!==cur.dir){
      keep();
      cur={a:i,b:i,dir:0}; continue;
    }
    cur.b=i;
  }
  keep();
  if(!best||best.b-best.a<3)return null;
  return {i0:best.a,i1:best.b,d0:fr[best.a].d,d1:fr[best.b].d,
          t0:fr[best.a].t,t1:fr[best.b].t};
}

/* ---------- 1. ความเร็วในการเดิน (Gait Speed Test) ---------- */
function radarGaitSpeed(fr){
  var w=radarWalk(fr); if(!w)return null;
  var distM=Math.abs(w.d1-w.d0)/100, sec=(w.t1-w.t0)/1000;
  /* สั้นกว่านี้เชื่อไม่ได้ เกณฑ์มาตรฐานใช้ทางเดิน 4 เมตร */
  if(sec<1||distM<1.5)return null;
  return {mps:Math.round(distM/sec*100)/100, distM:Math.round(distM*100)/100,
          sec:Math.round(sec*10)/10, src:"radar"};
}
/* ต่ำกว่า 0.8 เมตรต่อวินาที สัมพันธ์กับความเสี่ยงหกล้มและการเสียชีวิต
   ในผู้สูงอายุ (Studenski 2011, JAMA) */
function radarGaitLabel(mps){
  if(mps==null)return {nm:"วัดไม่ได้",cls:""};
  if(mps>=1.0)return {nm:"ปกติ",cls:"t4"};
  if(mps>=0.8)return {nm:"เริ่มช้า",cls:"t3"};
  if(mps>=0.6)return {nm:"ช้า",cls:"t2"};
  return {nm:"ช้ามาก",cls:"t1"};
}

/* ---------- 2. ลุกเดิน 3 เมตร (Timed Up and Go) ---------- */
function radarTUG(fr,minE){
  minE=minE||20;
  if(!fr||!fr.length)return null;
  var i,s=-1,e=-1;
  for(i=0;i<fr.length;i++)if(fr[i].e!=null&&fr[i].e>=minE){s=i;break}
  if(s<0)return null;
  for(i=fr.length-1;i>=0;i--)if(fr[i].e!=null&&fr[i].e>=minE){e=i;break}
  if(e<=s)return null;
  /* จุดไกลสุด = จุดกลับตัว ใช้ยืนยันว่าเดินออกไปแล้วกลับมาจริง
     ไม่ใช่แค่ขยับอยู่กับที่แล้วนับเป็นการทดสอบ */
  var far=-1,fd=-1,d0=null;
  for(i=s;i<=e;i++){
    if(fr[i].d==null)continue;
    if(d0==null)d0=fr[i].d;
    if(fr[i].d>fd){fd=fr[i].d;far=i}
  }
  if(d0==null||far<0)return null;
  var outM=(fd-d0)/100;
  if(outM<1.0)return null;
  return {sec:Math.round((fr[e].t-fr[s].t)/100)/10,
          outM:Math.round(outM*100)/100,
          turnSec:Math.round((fr[far].t-fr[s].t)/100)/10, src:"radar"};
}
/* เกณฑ์ TUG ที่ระบบใช้อยู่แล้วคือ 12 วินาที (CDC STEADI) */
function radarTUGLabel(sec){
  if(sec==null)return {nm:"วัดไม่ได้",cls:""};
  return sec>=12?{nm:"ช้ากว่าเกณฑ์ 12 วินาที",cls:"t2"}:{nm:"อยู่ในเกณฑ์",cls:"t4"};
}

/* ---------- 3. ลุกนั่ง 30 วินาที (30-Second Chair Stand) ----------
   นับจากจังหวะพลังงานที่ขึ้นลงเป็นคาบ ไม่ได้วัดความสูงที่ลุกขึ้น
   ต้องตกลงต่ำกว่าครึ่งของเกณฑ์ก่อน จึงจะนับครั้งใหม่ กันนับซ้ำจากยอดเดียว
   และต้องห่างกันอย่างน้อย 0.7 วินาที เพราะผู้สูงอายุลุกนั่งเร็วกว่านั้นไม่ได้ */
function radarChairStand(fr,minE,gapMs){
  minE=minE||30; gapMs=gapMs||700;
  var reps=0,last=null,up=false,i,f,marks=[];
  for(i=0;i<fr.length;i++){
    f=fr[i]; if(f.e==null)continue;
    if(!up&&f.e>=minE){
      if(last==null||f.t-last>=gapMs){reps++;last=f.t;marks.push(f.t)}
      up=true;
    }else if(up&&f.e<minE*0.5){ up=false }
  }
  var sec=fr.length?(fr[fr.length-1].t-fr[0].t)/1000:0;
  return {reps:reps,sec:Math.round(sec*10)/10,marks:marks,src:"radar"};
}
/* เกณฑ์ตามอายุและเพศจาก Rikli & Jones ซึ่ง CDC STEADI อ้างอิง */
function radarChairLabel(reps,age,sex){
  if(reps==null)return {nm:"วัดไม่ได้",cls:""};
  var a=Number(age)||70;
  var cut = sex==="f"
    ? (a<65?15:(a<70?14:(a<75?12:(a<80?11:(a<85?10:8)))))
    : (a<65?17:(a<70?15:(a<75?14:(a<80?12:(a<85?11:10)))));
  return reps<cut ? {nm:"ต่ำกว่าเกณฑ์อายุ",cls:"t2",cut:cut}
                  : {nm:"ผ่านเกณฑ์อายุ",cls:"t4",cut:cut};
}

/* ---------- 4. ทรงตัว 4 ท่า (4-Stage Balance) ----------
   เกณฑ์ CDC STEADI ถามแค่ว่ายืนครบ 10 วินาทีหรือไม่ ไม่ได้ขอค่าการแกว่ง
   จึงจับ "ก้าวเท้าออกจากท่า" เป็นหลัก คือระยะกระโดดเกินเกณฑ์
   หรือพลังงานพุ่งเกินเกณฑ์ ซึ่งสองอย่างนี้เกิดพร้อมกันเวลาคนเสียหลักจริง */
function radarBalance(fr,holdSec,jumpCm,minE){
  holdSec=holdSec||10; jumpCm=jumpCm||15; minE=minE||45;
  if(!fr||!fr.length)return null;
  var t0=fr[0].t,i,f,prev=null,stepAt=null;
  for(i=0;i<fr.length;i++){
    f=fr[i];
    var moved=(prev!=null&&f.d!=null&&Math.abs(f.d-prev)>=jumpCm);
    var burst=(f.e!=null&&f.e>=minE);
    if(moved||burst){ stepAt=(f.t-t0)/1000; break }
    if(f.d!=null)prev=f.d;
  }
  var span=(fr[fr.length-1].t-t0)/1000;
  var held=(stepAt==null)?Math.min(span,holdSec):stepAt;
  /* ค่าการแกว่งจากพลังงานของเป้าหมายนิ่ง เป็นข้อสังเกตประกอบ ไม่ใช่เกณฑ์ตัดสิน */
  var se=[],sum=0;
  for(i=0;i<fr.length;i++)if(fr[i].se!=null){se.push(fr[i].se);sum+=fr[i].se}
  var sway=null;
  if(se.length>=8){
    var m=sum/se.length,v=0;
    for(i=0;i<se.length;i++)v+=(se[i]-m)*(se[i]-m);
    sway=Math.round(Math.sqrt(v/se.length)*100)/100;
  }
  return {pass:(stepAt==null&&span>=holdSec-0.3), heldSec:Math.round(held*10)/10,
          steppedAtSec:(stepAt==null?null:Math.round(stepAt*10)/10),
          sway:sway, src:"radar"};
}

/* ============================================================
   ตัวจำลองสัญญาณ — ให้สาธิตและทดสอบได้โดยไม่ต้องมีฮาร์ดแวร์
   จำเป็นเพราะโค้ดฝั่งอุปกรณ์ยังไม่เคยรันกับเรดาร์จริง การมีตัวจำลอง
   ทำให้พิสูจน์ได้ว่าตัววิเคราะห์ถูกต้อง ก่อนจะไปเจอของจริง
   ============================================================ */
function radarSimFrames(kind,opt){
  opt=opt||{};
  var hz=opt.hz||10, dt=1000/hz, t=opt.t0||0, out=[], i;
  function push(d,e,se){ out.push({t:t,d:Math.round(d),e:e,sd:Math.round(d),se:se}); t+=dt }
  if(kind==="gait"){
    var mps=opt.mps||0.9, from=opt.from||500, to=opt.to||150, step=mps*100/hz;
    for(i=0;i<hz;i++)push(from,5,30);
    var d=from;
    while(d-step>to){ d-=step; push(d,55,20) }
    for(i=0;i<hz;i++)push(d,5,30);
  }else if(kind==="tug"){
    var outM=opt.outM||3, sec=opt.sec||12, d0=opt.d0||100;
    var half=Math.max(1,Math.round(sec*hz/2)), far=d0+outM*100;
    for(i=0;i<hz;i++)push(d0,5,30);
    for(i=0;i<half;i++)push(d0+(far-d0)*i/half,50,20);
    for(i=0;i<half;i++)push(far-(far-d0)*i/half,50,20);
    for(i=0;i<hz;i++)push(d0,5,30);
  }else if(kind==="chair"){
    var reps=opt.reps||12, secs=opt.sec||30, per=Math.max(3,Math.round(secs*hz/reps));
    var hi=Math.max(2,Math.round(per*0.35));
    for(i=0;i<secs*hz;i++)push(opt.d0||120,(i%per)<hi?60:8,25);
  }else if(kind==="balance"){
    var hold=opt.sec||10, stepAt=(opt.stepAt==null?null:opt.stepAt), dd=opt.d0||150;
    for(i=0;i<hold*hz;i++){
      var s=i/hz;
      if(stepAt!=null&&s>=stepAt)push(dd+20,60,40);
      else push(dd+(i%3===0?1:0),8,20+(i%5));
    }
  }
  return out;
}
/* เดินตัวจำลองแบบเรียลไทม์เข้าท่อเดียวกับของจริง เพื่อให้ UI ทำงานเหมือนกันทุกอย่าง */
function radarSimStart(kind,opt,done){
  radarDisconnect(); radarClear();
  var fr=radarSimFrames(kind,opt), i=0, base=Date.now();
  RADAR.on=true;
  RADAR.sim=setInterval(function(){
    if(i>=fr.length){ clearInterval(RADAR.sim); RADAR.sim=null; if(done)done(); return }
    var f=fr[i++];
    radarIngest({t:base+f.t,d:f.d,e:f.e,sd:f.sd,se:f.se});
  }, Math.max(10,(opt&&opt.speed)||20));
  return fr.length;
}

  if(rec.ftsst!=null)
    L.push("• ลุกนั่ง 5 ครั้ง: "+rec.ftsst.toFixed(1)+" วินาที"+
           (rec.method==="camera-pose"?" (วัดด้วยกล้อง)":(rec.method==="radar"?" (วัดด้วยเรดาร์)":" (จับเวลาเอง)")));
  else L.push("• ลุกนั่ง 5 ครั้ง: ข้ามการทดสอบ");
  if(rec.tug!=null)L.push("• ลุกเดิน 3 เมตร (TUG): "+rec.tug.toFixed(1)+" วินาที (เกณฑ์ 12 วินาที)");
  if(rec.gaps&&rec.gaps.length)L.push("• เวลาลุกแต่ละครั้ง: "+rec.gaps.join(" · ")+" วิ");
  if(rec.parts)L.push("• คะแนนรายด้าน — ลุกนั่ง "+rec.parts.ftsst+"/4 · ทรงตัว "+rec.parts.balance+
                      "/2 · ประวัติล้ม "+rec.parts.falls+"/1 · ยา "+rec.parts.meds+"/1 · กิจวัตร "+rec.parts.adl+"/1");
  L.push("• การยืนยันตัวตนระหว่างทดสอบ: "+(rec.verified?"ผ่าน":"ไม่ได้ยืนยัน"));
  L.push("");
  L.push("ปัจจัยที่ตรวจพบ (จากกฎที่ตรวจสอบได้)");
  var any=false;
  (base&&base.reds||[]).forEach(function(x){L.push("• ["+x.id+"] "+x.text);any=true});
  (base&&base.yellows||[]).forEach(function(x){L.push("• ["+x.id+"] "+x.text);any=true});
  (traj&&traj.flags||[]).forEach(function(x){L.push("• ["+x.id+"] "+x.text);any=true});
  if(!any)L.push("• ไม่พบปัจจัยเสี่ยงจากกฎชุดปัจจุบัน");
  if(signals&&signals.length){
    L.push("");
    L.push("คำแนะนำการทบทวน");
    var seen={};
    signals.forEach(function(s){
      var who=(destNm&&destNm[s.dest])||s.dest||"ทีมดูแล";
      if(seen[who])return; seen[who]=1;
      L.push("• "+who+": "+(s.text||s.type||""));
    });
  }
  L.push("");
  L.push("ข้อจำกัด: รายงานนี้เป็นผลคัดกรองจากข้อมูลที่ผู้ใช้และระบบบันทึก");
  L.push("ไม่ใช่การวินิจฉัยโรค และต้องผ่านการทบทวนโดยผู้เชี่ยวชาญก่อนดำเนินการ");
  return L.join(String.fromCharCode(10));
}

/* ---------- ส่งออก HL7 FHIR R4 Bundle ----------
   โครงตามมาตรฐานแลกเปลี่ยนข้อมูลสุขภาพสากล ให้โรงพยาบาลหรือบริษัทประกัน
   รับไปต่อได้โดยไม่ต้องเขียนตัวแปลงเฉพาะกิจ
     Patient        ข้อมูลพื้นฐานผู้รับการประเมิน
     Observation    ค่าที่วัดได้ทีละรายการ (TUG ใช้ LOINC 89423-8 ของจริง)
     RiskAssessment ระดับสัญญาณพร้อมเหตุผลรายข้อ */
function csFHIRBundle(rec,profile,base,traj){
  var p=profile||{}, uid=p.uid||"unknown";
  var when=rec.at?(rec.at.length>10?rec.at:rec.at+"T00:00:00+07:00"):undefined;
  var subject={reference:"Patient/"+uid};
  var entries=[];

  entries.push({resource:{
    resourceType:"Patient", id:String(uid),
    gender:p.sex==="f"?"female":(p.sex==="m"?"male":"unknown"),
    /* ปีเกิดเก็บเป็น พ.ศ. — FHIR ใช้ ค.ศ. และยอมรับความละเอียดระดับปี */
    birthDate:p.birthYear?String(p.birthYear-543):undefined
  }});

  if(rec.tug!=null)entries.push({resource:{
    resourceType:"Observation", status:"final",
    code:{coding:[{system:"http://loinc.org",code:"89423-8",
      display:"Time elapsed to rise from chair walk 3 meters turn around and sit down"}],
      text:"ลุกเดิน 3 เมตร (Timed Up and Go)"},
    subject:subject, effectiveDateTime:when,
    valueQuantity:{value:rec.tug,unit:"s",system:"http://unitsofmeasure.org",code:"s"},
    method:{text:rec.method==="camera-pose"?"camera pose estimation":"manual timing"}
  }});

  if(rec.ftsst!=null)entries.push({resource:{
    resourceType:"Observation", status:"final",
    /* ลุกนั่ง 5 ครั้งยังไม่มีรหัส LOINC ที่ยืนยันได้ จึงใส่เป็นข้อความล้วน
       จงใจไม่แต่งรหัสขึ้นเอง — รหัสปลอมในข้อมูลสุขภาพอันตรายกว่าไม่มีรหัส */
    code:{text:"Five times sit-to-stand time (ลุกนั่ง 5 ครั้ง)"},
    subject:subject, effectiveDateTime:when,
    valueQuantity:{value:rec.ftsst,unit:"s",system:"http://unitsofmeasure.org",code:"s"},
    method:{text:rec.method==="camera-pose"?"camera pose estimation":
                 (rec.method==="radar"?"mmWave radar":"manual timing")}
  }});

  if(rec.parts)entries.push({resource:{
    resourceType:"Observation", status:"final",
    code:{text:"CareSignal domain scores (คะแนนรายด้าน)"},
    subject:subject, effectiveDateTime:when,
    component:[
      {code:{text:"sit-to-stand"},valueInteger:rec.parts.ftsst},
      {code:{text:"balance"},valueInteger:rec.parts.balance},
      {code:{text:"falls history"},valueInteger:rec.parts.falls},
      {code:{text:"medications"},valueInteger:rec.parts.meds},
      {code:{text:"ADL"},valueInteger:rec.parts.adl},
      {code:{text:"identity verified"},valueBoolean:!!rec.verified}
    ]
  }});

  var tierNm={0:"low",1:"moderate",2:"high",3:"very-high"};
  var notes=[];
  (base&&base.reds||[]).forEach(function(x){notes.push({text:"["+x.id+"] "+x.text})});
  (base&&base.yellows||[]).forEach(function(x){notes.push({text:"["+x.id+"] "+x.text})});
  (traj&&traj.flags||[]).forEach(function(x){notes.push({text:"["+x.id+"] "+x.text})});
  entries.push({resource:{
    resourceType:"RiskAssessment", status:"final",
    subject:subject, occurrenceDateTime:when,
    prediction:[{outcome:{text:"fall and dependency risk (ความเสี่ยงหกล้มและภาวะพึ่งพิง)"},
                 qualitativeRisk:{text:tierNm[rec.tier]||String(rec.tier)}}],
    note:notes,
    /* ประกาศตัวตนของเครื่องมือ: คัดกรอง ไม่ใช่วินิจฉัย */
    mitigation:"Screening result only. Requires professional review before any action."
  }});

  return {resourceType:"Bundle", type:"collection",
          timestamp:when, entry:entries};
}

var SPK={last:{},until:0,hold:0};
function speak(text,opts){
  opts=opts||{};
  var fin=function(){ if(opts.onDone){var f=opts.onDone;opts.onDone=null;try{f()}catch(e){}} };
  if(!VOICE.on||!text){setTimeout(fin,120);return}
  try{
    if(!("speechSynthesis" in window)){setTimeout(fin,120);return}
    /* กันพูดซ้ำ: ประโยคเดิมภายใน 4 วินาทีไม่พูดซ้ำ — แก้อาการ "พูดซ้ำไปซ้ำมา"
       เมื่อหลายจุดในโปรแกรมเรียกพูดข้อความเดียวกันติด ๆ กัน */
    var key=normText(text), now=Date.now();
    if(!opts.force&&SPK.last[key]&&now-SPK.last[key]<4000){setTimeout(fin,120);return}
    SPK.last[key]=now;
    /* หน้าต่างเวลาที่ระบบกำลังพูด — ประเมินจากความยาวข้อความก่อน
       แล้วร่นให้สั้นลงเมื่อรู้เวลาพูดจบจริง ใช้เป็นด่านกันฟังเสียงตัวเอง */
    SPK.until=now+800+text.length*75;
    /* ในหน้าต่างทวนกลับ (SPK.hold) ให้ต่อคิว ไม่ตัดคำว่า รับทราบ ทิ้ง */
    if(opts.interrupt!==false&&now>=SPK.hold)speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="th-TH"; u.rate=opts.rate||0.95; u.volume=1;
    var v=speechSynthesis.getVoices().filter(function(x){return /th/i.test(x.lang)});
    if(v.length)u.voice=v[0];
    var done=function(){ SPK.until=Date.now()+600; fin() };
    u.onend=done; u.onerror=done;
    /* บางเครื่องเหตุการณ์พูดจบไม่มา — ตั้งเผื่อไว้ตามความยาวข้อความ ไม่ให้อะไรค้าง */
    setTimeout(done, 800+text.length*75);
    speechSynthesis.speak(u);
  }catch(e2){fin()}
}
function voiceToggle(){
  VOICE.on=!VOICE.on;
  try{localStorage.setItem("csv:voice",VOICE.on?"on":"off")}catch(e){}
  if(VOICE.on)speak("เปิดเสียงแนะนำแล้ว");
  return VOICE.on;
}

/* ============================================================
   จับอัตโนมัติ (AutoCapture) — ไม่ต้องกดปุ่มเอง
   ------------------------------------------------------------
   ปัญหาที่แก้: ผู้สูงอายุที่อยู่คนเดียวต้องเดินมากดปุ่มบันทึก
   แต่พอเดินมาถึงมือถือ กล้องก็มองไม่เห็นตัวอีก กลายเป็นวงจรตัน

   วิธีทำงาน: เมื่อเงื่อนไข "พร้อม" ต่อเนื่องครบ holdMs
   ระบบจะพูดนับถอยหลัง 3-2-1 แล้วบันทึกให้เอง
   ถ้าระหว่างนับผู้ใช้หลุดออกจากกรอบ จะยกเลิกและเริ่มนับใหม่
   ปุ่มกดเองยังใช้ได้ตามปกติสำหรับคนที่มีผู้ช่วย
   ============================================================ */
function AutoCapture(opts){
  opts=opts||{};
  this.holdMs=opts.holdMs!==undefined?opts.holdMs:1600;  /* ต้องพร้อมต่อเนื่องเท่าไรก่อนเริ่มนับ */
  this.onFire=opts.onFire||function(){};
  this.readyText=opts.readyText||"พร้อมแล้ว";
  this.abortOnLost=opts.abortOnLost!==false;
  this.screen=opts.screen||null;      /* ยกเลิกอัตโนมัติถ้าเปลี่ยนหน้าจอ */
  this.readySince=null; this.counting=false; this.done=false; this.timer=null;
  this.enabled=opts.enabled!==false;
  this.announce=!!opts.announce;  /* โหมดประกาศ: บอกว่าพร้อมแล้วรอคำสั่ง ไม่นับถอยหลังเอง */
}
AutoCapture.prototype.update=function(ready){
  if(this.done||!this.enabled)return;
  if(this.counting){ if(this.abortOnLost&&!ready)this.abort(); return }
  if(!ready){this.readySince=null;return}
  if(this.readySince===null){this.readySince=performance.now();return}
  if(performance.now()-this.readySince>=this.holdMs)this.begin();
};
AutoCapture.prototype.begin=function(){
  if(this.announce){this.counting=false;this.done=true;this.onFire();return}
  var self=this; this.counting=true;
  var n=3, nm={3:"สาม",2:"สอง",1:"หนึ่ง"};
  setStatus("green",this.readyText+" — เตรียมตัว "+n,false);
  speak(this.readyText+" เตรียมตัว "+nm[n]);
  this.timer=setInterval(function(){
    if(self.screen&&S.screen!==self.screen){self.abort();return}
    n--;
    if(n>=1){setStatus("green","เตรียมตัว… "+n,false);speak(nm[n])}
    else{
      clearInterval(self.timer);self.timer=null;
      self.counting=false;self.done=true;
      setStatus("green","เริ่ม",false);speak("เริ่ม");
      self.onFire();
    }
  },1000);
};
AutoCapture.prototype.abort=function(){
  if(this.timer){clearInterval(this.timer);this.timer=null}
  this.counting=false;this.readySince=null;
};
AutoCapture.prototype.reset=function(){this.abort();this.done=false};

/* ============================================================
   ยืนยันตัวตนด้วยใบหน้า (Face Continuity)
   ------------------------------------------------------------
   วัตถุประสงค์: ยืนยันว่า "คนที่ทำการทดสอบคือเจ้าของบัญชีจริง"
   ไม่ใช่ระบบพิสูจน์ตัวตนแบบธนาคาร แต่กันการให้คนอื่นทำแทน

   วิธีทำงาน:
   1) ลงทะเบียนครั้งเดียว — วัดสัดส่วนใบหน้าเป็นตัวเลข 6 ค่า
   2) ระหว่างการทดสอบ ระบบตรวจซ้ำทุก ~2 วินาที ว่ายังเป็นคนเดิม
   3) เก็บ "ลายเซ็นเชิงสัดส่วน" ในเครื่องเท่านั้น ไม่เก็บภาพ ไม่อัปโหลด
   ⚠️ ข้อมูลชีวมิติเป็นข้อมูลอ่อนไหวตาม PDPA มาตรา 26 จึงขอความยินยอมแยก
      และผู้ใช้ปฏิเสธได้โดยยังใช้ระบบได้ตามปกติ
   ============================================================ */
var FACE=null, FACE_STATE="idle";
var FL={LEYE_OUT:33, REYE_OUT:263, LEYE_IN:133, REYE_IN:362, NOSE:1, NOSE_L:97, NOSE_R:326,
        MOUTH_L:61, MOUTH_R:291, CHIN:152, FOREHEAD:10};
var FACE_TOL=0.16;   /* ระยะที่ยอมรับว่าเป็นคนเดิม — ผ่อนปรนเพื่อลดการปฏิเสธผิดพลาด */

async function loadFaceModel(statusEl){
  if(FACE)return FACE;
  FACE_STATE="loading";
  if(statusEl)statusEl.textContent="กำลังโหลดตัวตรวจใบหน้า…";
  var mod=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14");
  var fs=await mod.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  FACE=await mod.FaceLandmarker.createFromOptions(fs,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},
    runningMode:"VIDEO",numFaces:1});
  FACE_STATE="ready";
  return FACE;
}
function fdist(a,b){return Math.hypot(a.x-b.x,a.y-b.y,(a.z||0)-(b.z||0))}
/* ลายเซ็นเชิงสัดส่วน — หารด้วยระยะระหว่างตา จึงไม่ขึ้นกับระยะห่างจากกล้อง */
function faceSignature(lm){
  var base=fdist(lm[FL.LEYE_OUT],lm[FL.REYE_OUT]);
  if(!base||base<1e-6)return null;
  return [fdist(lm[FL.LEYE_IN],lm[FL.REYE_IN])/base,
          fdist(lm[FL.NOSE],lm[FL.CHIN])/base,
          fdist(lm[FL.MOUTH_L],lm[FL.MOUTH_R])/base,
          fdist(lm[FL.NOSE_L],lm[FL.NOSE_R])/base,
          fdist(lm[FL.FOREHEAD],lm[FL.CHIN])/base,
          fdist(lm[FL.LEYE_OUT],lm[FL.MOUTH_L])/base];
}
function sigDist(a,b){
  if(!a||!b||a.length!==b.length)return 99;
  var s=0;for(var i=0;i<a.length;i++)s+=(a[i]-b[i])*(a[i]-b[i]);
  return Math.sqrt(s);
}
/* กุญแจผูกกับบัญชีคลาวด์ถ้าล็อกอินแล้ว — เครื่องเดียวหลายบัญชีไม่ปะปนกัน */
function faceKeyId(){
  try{if(CLOUD.session&&CSBackend.getProfile())return CSBackend.getProfile().id}catch(e){}
  return S.data.profile?S.data.profile.uid:"local";
}
function saveFaceSig(sig){
  try{localStorage.setItem("csv:faceSig:"+faceKeyId(),JSON.stringify(sig))}catch(e){}
  S.data.faceEnrolled=true;
  if(CLOUD.session)CSBackend.grantConsent("biometric_face","PDPA-1.0",
    {stored:"on-device-only",values:6,uploaded:false}).catch(function(){});
}
function loadFaceSig(){try{var s=localStorage.getItem("csv:faceSig:"+faceKeyId());return s?JSON.parse(s):null}catch(e){return null}}
function clearFaceSig(){
  try{localStorage.removeItem("csv:faceSig:"+faceKeyId())}catch(e){}
  S.data.faceEnrolled=false;
  if(CLOUD.session)CSBackend.revokeConsent("biometric_face").catch(function(){});
}

/* ============================================================
   เสียงพูดชวนบนหน้ายืนยัน — พูดอย่างเดียว ไม่ฟัง
   ------------------------------------------------------------
   หน้ายืนยันท้ายหัวข้ออยู่ใกล้มือ ผู้ใช้กดปุ่มได้เอง จึงไม่ต้องสั่งระยะไกล
   เหลือไว้แค่การพูดทวนว่าบันทึกอะไรไปแล้ว เพื่อให้คนที่อ่านจอไม่ถนัดยังรู้ผล
   พูดหลังหน้าจอวาดเสร็จ ไม่ให้ทับเสียงก่อนหน้า
   ============================================================ */
function spokenPrompt(text){
  if(!VOICE.on||!text)return false;
  setTimeout(function(){speak(text)},500);
  return true;
}

function sectState(sec){
  var d=S.draft||{};
  if(!sec.done(d)) return "todo";
  if(d[sec.k+"Skipped"]) return "skip";
  if(sec.k==="tug"&&d.tug==null) return "skip";
  if(sec.k==="ftsst"&&d.ftsst==null) return "skip";
  return "done";
}

async function saveDraft(){
  /* ร่างเก็บในเครื่องผู้ใช้ ซึ่งไม่ได้เข้ารหัสและอยู่ยาว รูปฉลากยาเป็นข้อมูลสุขภาพ
     จึงถอดรูปย่อออกก่อนบันทึกร่างเสมอ รูปยังอยู่บนหน้าจอระหว่างทำแบบประเมิน
     แต่จะไม่ติดไปกับร่างที่กู้คืนทีหลัง */
  try{
    var d=JSON.parse(JSON.stringify(S.draft));
    if(d.medsDetail&&d.medsDetail.items)
      d.medsDetail.items.forEach(function(x){ delete x.thumb });
    await DB.set("assessDraft",{at:Date.now(),draft:d});
  }catch(e){}
}
async function loadDraft(){
  try{
    var v=await DB.get("assessDraft");
    if(!v||!v.draft) return null;
    if(Date.now()-v.at>864e5){ await clearDraft(); return null }
    return v;
  }catch(e){ return null }
}
async function clearDraft(){ try{ await DB.set("assessDraft",null) }catch(e){} }

    '<button class="ghostb" id="scRedo">ทำหัวข้อนี้ใหม่</button>'+

  spokenPrompt("บันทึก"+(sec?sec.t:"")+"แล้ว "+(opts.value||(sec?sec.sum(S.draft):""))+

}

async function startFacePipeline(){
  /* ครึ่งจอ ไม่ใช่เต็มจอ — ต้องย้ายช่องติ๊กยินยอมลงแผงด้วย ไม่ใช่แค่ปุ่ม
     มิฉะนั้นช่องติ๊กจะอยู่หลังกล้อง กดไม่ได้ และปุ่มบันทึกค้าง disabled */
  camHalf(["fcChkWrap","fcSave","fcSkip","fcDel"]);
  var video=document.getElementById("vid"),canvas=document.getElementById("cv"),ctx=canvas.getContext("2d");
  var tag=document.getElementById("tag"),coach=document.getElementById("coach"),
      save=document.getElementById("fcSave"),chk=document.getElementById("fcConsent");
  var stream,cur=null;
  setStatus("yellow","กำลังเปิดกล้อง กรุณารอสักครู่");
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:480},height:{ideal:480}},audio:false})}
  catch(e){tag.textContent="เปิดกล้องไม่ได้";coach.textContent="ข้ามขั้นนี้ได้ ผลจะระบุว่าไม่ได้ยืนยันตัวตน";
    setStatus("red","เปิดกล้องไม่ได้ — ข้ามขั้นนี้ได้ กดปุ่มข้ามด้านล่าง");return}
  S.cam=stream;video.srcObject=stream;/* บางเบราว์เซอร์ play() ค้างไม่ resolve เมื่อหน้าจอถูกซ่อนหรือสตรีมผิดปกติ
     ใส่เพดานเวลาไว้ 1.5 วินาที เพื่อไม่ให้การทดสอบค้างตั้งแต่เปิดกล้อง */
  await Promise.race([video.play().catch(function(){}),new Promise(function(r){setTimeout(r,1500)})]);
  try{await loadFaceModel(tag)}
  catch(e){tag.textContent="โหลดตัวตรวจใบหน้าไม่สำเร็จ";coach.textContent="ข้ามขั้นนี้ได้ ต้องต่ออินเทอร์เน็ตครั้งแรก";return}
  tag.textContent="พร้อมแล้ว";
  function loop(){
    if(S.screen!=="face")return;
    var r=null;try{r=FACE.detectForVideo(video,performance.now())}catch(e){}
    var lm=r&&r.faceLandmarks&&r.faceLandmarks[0]?r.faceLandmarks[0]:null;
    if(canvas.width!==video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight}
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(lm){
      ctx.fillStyle="rgba(96,165,250,.85)";
      [FL.LEYE_OUT,FL.REYE_OUT,FL.NOSE,FL.MOUTH_L,FL.MOUTH_R,FL.CHIN].forEach(function(i){
        var p=lm[i];if(!p)return;
        ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,Math.max(3,canvas.width/120),0,6.3);ctx.fill();
      });
      var sg=faceSignature(lm);
      if(sg){cur=sg;tag.textContent="พบใบหน้าแล้ว";
        save.disabled=!chk.checked;
        if(chk.checked){
          coach.textContent="เห็นชัดแล้ว — ระบบจะบันทึกให้เองอัตโนมัติ";
          if(!AUTO.counting)setStatus("green","พบใบหน้าแล้ว — เตรียมบันทึกอัตโนมัติ",false);
        }else{
          coach.textContent="เห็นใบหน้าแล้ว — ติ๊กยินยอมด้านล่าง ระบบจะบันทึกให้เอง";
          setStatus("yellow","เห็นใบหน้าแล้ว — ติ๊กยินยอมด้านล่างก่อน");
        }
      }
    }else{tag.textContent="ยังไม่พบใบหน้า";coach.textContent="ขยับให้เห็นใบหน้าเต็มในกรอบ";save.disabled=true;

var POSE=null, RAF=null, DET=null, MODEL_STATE="idle";
/* ============================================================
   โมเดลตรวจจับท่าทาง — เลือกรุ่นละเอียดที่สุดที่เครื่องรับไหว
   ------------------------------------------------------------
   MediaPipe PoseLandmarker มี 3 รุ่น: heavy (ละเอียดสูงสุด แม่นสุด
   โดยเฉพาะจุดปลายแขนขา/เท้า) → full → lite
   ระบบไล่จาก heavy ลงมาเมื่อโหลดไม่ผ่าน และวัดเวลาประมวลผลจริง —
   ถ้าเครื่องช้ากว่า ~9 เฟรม/วินาที จะจดไว้ให้ครั้งถัดไปใช้รุ่นเบากว่า
   โดยอัตโนมัติ ผู้ใช้ไม่ต้องตั้งค่าอะไรเลย
   ============================================================ */
var POSE_LEVELS=[
  {k:"heavy",nm:"ละเอียดสูงสุด",u:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task"},
  {k:"full", nm:"ละเอียดสูง",   u:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task"},
  {k:"lite", nm:"มาตรฐาน",     u:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"}];
async function loadModel(statusEl){
  if(POSE)return POSE;
  MODEL_STATE="loading";
  var mod=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14");
  var fileset=await mod.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  var start=0;
  try{
    var sv=localStorage.getItem("cs-pose-model");
    var si=POSE_LEVELS.findIndex(function(l){return l.k===sv});
    if(si>0)start=si;                       /* เครื่องนี้เคยต้องถอยรุ่น — เริ่มที่รุ่นที่เหมาะ */
  }catch(e){}
  for(var i=start;i<POSE_LEVELS.length;i++){
    var L=POSE_LEVELS[i];
    if(statusEl)statusEl.textContent="กำลังโหลดโมเดล"+L.nm+"…";
    try{
      POSE=await mod.PoseLandmarker.createFromOptions(fileset,{
        baseOptions:{modelAssetPath:L.u,delegate:"GPU"},
        runningMode:"VIDEO",numPoses:2,   /* ตัวที่สองไว้รู้ว่ามีคนเข้ามาพยุงไหม */

        minPoseDetectionConfidence:.6,minPosePresenceConfidence:.6,minTrackingConfidence:.6
      });
      POSE.modelLevel=L.k;
      try{localStorage.setItem("cs-pose-model",L.k)}catch(e2){}
      MODEL_STATE="ready";
      return POSE;
    }catch(e3){POSE=null}                   /* รุ่นนี้โหลดไม่ผ่าน — ลองรุ่นถัดไป */
  }
  MODEL_STATE="error";
  throw new Error("model-load-failed");
}
/* เรียกตัวตรวจจับหนึ่งเฟรม พร้อมวัดเวลา — ช้าเกินก็จดให้รอบหน้าลดรุ่น */
var POSE_PERF={n:0,sum:0,noted:false};
var POSE_COUNT=0;          /* จำนวนคนที่กล้องเห็นในเฟรมล่าสุด */
function detectPose(video){
  if(!POSE)return null;
  var t=performance.now(), r=null;
  try{r=POSE.detectForVideo(video,t)}catch(e){POSE_COUNT=0;return null}
  POSE_COUNT=r&&r.landmarks?r.landmarks.length:0;
  POSE_PERF.n++;POSE_PERF.sum+=performance.now()-t;
  if(!POSE_PERF.noted&&POSE_PERF.n>=150&&POSE_PERF.sum/POSE_PERF.n>110){
    POSE_PERF.noted=true;
    var i=POSE_LEVELS.findIndex(function(l){return l.k===POSE.modelLevel});
    if(i>=0&&i<POSE_LEVELS.length-1){
      try{localStorage.setItem("cs-pose-model",POSE_LEVELS[i+1].k)}catch(e2){}
    }
  }
  return r&&r.landmarks&&r.landmarks[0]?r.landmarks[0]:null;
}

function drawPose(ctx,canvas,video,lm){
  if(canvas.width!==video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight}
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!lm)return;
  var pairs=[[11,12],[11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28],[11,13],[13,15],[12,14],[14,16]];
  ctx.lineWidth=Math.max(3,canvas.width/150); ctx.strokeStyle="rgba(96,165,250,.9)"; ctx.lineCap="round";
  pairs.forEach(function(p){
    var a=lm[p[0]],b=lm[p[1]]; if(!a||!b)return;
    ctx.beginPath();ctx.moveTo(a.x*canvas.width,a.y*canvas.height);ctx.lineTo(b.x*canvas.width,b.y*canvas.height);ctx.stroke();
  });
  [11,12,23,24,25,26,27,28].forEach(function(i){
    var p=lm[i]; if(!p)return;
    ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,Math.max(4,canvas.width/110),0,6.3);
    ctx.fillStyle=(i===23||i===24)?"#FCD34D":"#DBEAFE";ctx.fill();
  });
}
/* ============================================================
   สอบเทียบ — คนเป็นผู้บอกว่าท่าไหนคือท่านั่ง ท่าไหนคือท่ายืน
   ------------------------------------------------------------
   ของเดิมระบบจับเวลา "นิ่งครบ 2 วินาที" แล้วบันทึกเอง โดยไม่รู้เลยว่า
   ตอนนั้นคนนั่งอยู่หรือยืนอยู่ ถ้าผู้ใช้ยังไม่ทันนั่ง หรือยืนค้างอยู่
   ค่าที่ได้ก็สลับกัน แล้วการนับลุกนั่งทั้งชุดก็เพี้ยนตามไปหมด

   รุ่นนี้กลับด้าน: กล้อง "รายงาน" สิ่งที่เห็นอย่างเดียว ไม่บันทึกเอง
   ผู้ใช้นั่งลงแล้วยกมือค้างไว้ (หรือกดปุ่ม) เพื่อบันทึกท่านั่ง · ยืนขึ้นแล้วทำแบบเดียวกัน
   ระบบขานรับทุกครั้งว่าบันทึกอะไรไปแล้ว จะทำสลับลำดับก็ได้
   ============================================================ */
function setupCalib(video,canvas,ctx){
  var sitVal=null, standVal=null, cur=null;
  var CALH=[], CALKIND=null;
  /* นิ่ง = ค่าล่าสุด 14 เฟรมแกว่งน้อยกว่า 0.012 ราวครึ่งวินาทีที่ไม่ขยับ */
  function calSteady(){
    if(CALH.length<14)return false;
    var mn=Math.min.apply(null,CALH), mx=Math.max.apply(null,CALH);
    return (mx-mn)<0.012;
  }
  var cap=document.getElementById("cap"), cstep=document.getElementById("cstep"), coach=document.getElementById("coach");
  var capStand=document.getElementById("capStand");

  function fmtState(){
    return "บันทึกแล้ว: "+(sitVal!=null?"ท่านั่ง ✓":"ท่านั่ง —")+" · "+(standVal!=null?"ท่ายืน ✓":"ท่ายืน —");
  }
  /* กล้องบอกได้แค่ "เทียบกับค่าที่บันทึกไว้แล้ว สูงขึ้นหรือต่ำลง"
     ไม่เดาเองว่านั่งหรือยืนเมื่อยังไม่มีอะไรให้เทียบ */
  function seenText(){
    if(cur==null)return null;
    if(sitVal==null&&standVal==null)return null;
    var ref=sitVal!=null?sitVal:standVal, isSit=sitVal!=null;
    var d=cur-ref;
    if(isSit)  return d>0.05?"ตอนนี้ตัวสูงกว่าค่าท่านั่งที่บันทึกไว้":"ตอนนี้ยังใกล้เคียงค่าท่านั่งที่บันทึกไว้";
    return d<-0.05?"ตอนนี้ตัวต่ำกว่าค่าท่ายืนที่บันทึกไว้":"ตอนนี้ยังใกล้เคียงค่าท่ายืนที่บันทึกไว้";
  }
  function loop(){
    if(S.screen!=="calib"){return}
    var lm=detectPose(video);
    drawPose(ctx,canvas,video,lm);
    gestureTick(lm);
    var ok=false;
    if(lm){
      var q=visOK(lm), m=hipRatio(lm);
      if(q<0.85){cur=null;coach.textContent="ขยับมือถือให้เห็นตั้งแต่ศีรษะถึงเท้า";
        setStatus("yellow","ยังเห็นตัวไม่ครบ — ถอยมือถือให้เห็นตั้งแต่หัวถึงเท้า",false)}
      else if(m==null){cur=null;coach.textContent="ยังจับสัดส่วนลำตัวไม่ได้ ลองถอยห่างอีกเล็กน้อย";
        setStatus("yellow","ถอยห่างอีกนิด ให้เห็นทั้งตัว",false)}
      else{
        cur=m; ok=true;
        /* เก็บค่าไว้ดูว่านิ่งหรือยัง — ตอนสอบเทียบยังไม่รู้ว่าค่าไหนคือนั่งค่าไหนคือยืน
           จึงดูที่ความนิ่งแทนค่าสัมบูรณ์ ส่วนท่ายืนเพิ่มเงื่อนไขว่าต้องต่างจากท่านั่งพอ */
        CALH.push(m); if(CALH.length>14)CALH.shift();
        var s=seenText();
        coach.innerHTML="<b>"+esc(fmtState())+"</b><br>"+
          (s?esc(s)+" — ":"")+'ยกมือค้างไว้ 1 วินาที หรือกดปุ่ม เพื่อบันทึกท่าที่กำลังทำอยู่';
        setStatus("green","เห็นตัวชัดแล้ว — ท่านเป็นผู้สั่งว่าจะบันทึกท่าไหน",false);
      }
    }else{cur=null;coach.textContent="ยังไม่พบคนในภาพ";
      setStatus("yellow","ยังไม่พบคนในภาพ — เข้ามาในกรอบกล้อง",false)}
    cap.disabled=!ok; if(capStand)capStand.disabled=!ok;
    if(!ok)CALH.length=0;
    /* กล้องเห็นว่านิ่งในท่าที่ต้องการแล้ว = นับถอยหลังแล้วบันทึกเอง
       ไม่ต้องรอให้พูด แต่ยังพูดสั่งได้ตลอดถ้าอยากเร่ง */
    if(ok&&CALKIND&&!cdRunning()&&calSteady()){
      var far=(CALKIND==="sit")||(sitVal!=null&&cur-sitVal>=0.045);
      if(far){
        var k=CALKIND; CALKIND=null;
        cdStart({screen:S.screen,text:(k==="sit"?"เห็นว่านั่งแล้ว":"เห็นว่ายืนแล้ว"),
          onFire:function(){capture(k)}});
      }
    }
    RAF=requestAnimationFrame(loop);
  }
  loop();

  function capture(kind){
    if(cur==null){speak("ยังมองไม่เห็นตัวชัดพอ กรุณาขยับให้เห็นทั้งตัวก่อน");
      setStatus("yellow","ยังมองไม่เห็นตัวชัดพอ — ยังบันทึกไม่ได้",false);return}
    /* บันทึกแล้วเดินไปขั้นถัดไปเอง ผู้ใช้ไม่ต้องจำว่าเหลืออะไร */
    if(kind==="sit"){sitVal=cur;toast("บันทึกท่านั่งแล้ว")}
    else{standVal=cur;toast("บันทึกท่ายืนแล้ว")}

    setStatus("green",(kind==="sit"?"บันทึกท่านั่งเรียบร้อย":"บันทึกท่ายืนเรียบร้อย")+" · "+fmtState(),false);
    if(sitVal!=null&&standVal!=null){stepStop();finish();return}
    if(kind==="sit"&&CAL_ASK_STAND)CAL_ASK_STAND();
    else if(kind==="stand"&&CAL_ASK_SIT)CAL_ASK_SIT();
  }
  function finish(){
    if(standVal-sitVal<0.045){
      /* ค่าสองท่าใกล้กันเกินไป = น่าจะบันทึกท่าเดียวกันสองครั้ง หรือสลับกัน */

      sitVal=null;standVal=null;cstep.textContent=fmtState();
      speak("ค่าท่านั่งกับท่ายืนต่างกันน้อยเกินไป อาจบันทึกท่าเดียวกันสองครั้ง เริ่มใหม่ทีละท่า");
      if(CAL_ASK_SIT)setTimeout(CAL_ASK_SIT,4200);
      return;
    }
    S.draft.sitRef=sitVal;S.draft.standRef=standVal;
    audit("สอบเทียบกล้อง (ผู้ใช้เป็นผู้สั่งบันทึกทีละท่า)",
      "ค่าท่านั่ง "+sitVal.toFixed(3)+" ค่าท่ายืน "+standVal.toFixed(3)+" ช่วงห่าง "+(standVal-sitVal).toFixed(3));
    toast("สอบเทียบเรียบร้อย");
    setStatus("green","สอบเทียบเรียบร้อย — ขั้นต่อไป ทดสอบลุกนั่ง 5 ครั้ง",false);
    speak("สอบเทียบเรียบร้อยแล้ว ขั้นตอนต่อไป ทดสอบลุกนั่ง ห้าครั้ง กรุณานั่งลงบนเก้าอี้");
    rcStop();
    setTimeout(function(){go("test")},2600);
  }
  cap.addEventListener("click",function(){capture("sit")});
  if(capStand)capStand.addEventListener("click",function(){capture("stand")});
  /* ทีละขั้น: บอกให้ทำท่าไหน แล้วรอคำว่า "บันทึก" คำเดียว ทำทันที
     เดิมต้องพูด "บันทึกท่านั่ง" แล้วตอบ "ยืนยัน" อีกครั้ง ซึ่งยาวและพลาดง่าย */
  function calBail(){cdCancel(true);CALKIND=null;stepStop();rcStop();stopCam();go("assess")}
  function calReset(){
    cdCancel(true); CALKIND=null; CALH.length=0;
    sitVal=null;standVal=null;cstep.textContent=fmtState();
    setStatus("yellow","ล้างค่าที่บันทึกไว้แล้ว — เริ่มบันทึกใหม่",false);
    askSit();
  }
  function askSit(){
    stepBegin({id:"calSit",
      cue:"ท่านั่ง นั่งลงแล้วยกมือค้างไว้ หรือกดปุ่มบันทึก",
      hint:"ยกมือค้างไว้ หรือกดปุ่มบันทึก",
      on:{record:function(){cdCancel(true);capture("sit")},redo:calReset,stop:calBail}});
    CALKIND="sit"; CALH.length=0;
  }
  function askStand(){
    stepBegin({id:"calStand",
      cue:"ท่ายืน ยืนขึ้นแล้วยกมือค้างไว้ หรือกดปุ่มบันทึก",
      hint:"ยกมือค้างไว้ หรือกดปุ่มบันทึก",
      on:{record:function(){cdCancel(true);capture("stand")},redo:calReset,stop:calBail}});
    CALKIND="stand"; CALH.length=0;
  }
  CAL_ASK_SIT=askSit; CAL_ASK_STAND=askStand;

}
var CAL_ASK_SIT=null, CAL_ASK_STAND=null;
function setupTest(video,canvas,ctx){
  DET=new RepDetector({target:5});
  /* ตรวจใบหน้าเป็นระยะระหว่างทดสอบ กันการสลับคนกลางคัน */
  var faceRef=faceEnabled()?loadFaceSig():null;
  var frameN=0, faceChecks=0, faceFails=0;
  S.draft.identityChecks=0; S.draft.identityFails=0;
  DET.setRefs(S.draft.sitRef,S.draft.standRef);
  var repEl=document.getElementById("rep"),clk=document.getElementById("clk"),trk=document.getElementById("trk"),
      st=document.getElementById("st"),coach=document.getElementById("coach"),qual=document.getElementById("qual"),
      startBtn=document.getElementById("startBtn"),stopBtn=document.getElementById("stopBtn");
  var running=false, t0=0, lastEvt=0, AUTOSTART=null;
  function loop(){
    if(S.screen!=="test")return;
    var lm=detectPose(video);
    drawPose(ctx,canvas,video,lm);
    gestureTick(lm);
    frameN++;
    /* ตรวจใบหน้าทุก ~60 เฟรม (≈2 วินาที) เฉพาะตอนกำลังจับเวลา */
    if(faceRef&&running&&FACE&&frameN%60===0){
      try{
        var fr=FACE.detectForVideo(video,performance.now());
        var flm=fr&&fr.faceLandmarks&&fr.faceLandmarks[0]?fr.faceLandmarks[0]:null;
        if(flm){
          var sg=faceSignature(flm);
          faceChecks++; S.draft.identityChecks=faceChecks;
          if(sigDist(sg,faceRef)>FACE_TOL){faceFails++; S.draft.identityFails=faceFails}
        }
      }catch(e){}
    }
    if(lm){
      var q=visOK(lm),m=hipRatio(lm),ka=kneeAngle(lm);
      qual.innerHTML="คุณภาพภาพ <b>"+Math.round(q*100)+"%</b>"+(ka!=null?" · เข่า "+Math.round(ka)+"°":"")+
        (faceRef?(faceFails>0?" · <b style='color:#FCA5A5'>ใบหน้าไม่ตรง</b>":(faceChecks?" · <b style='color:#6EE7B7'>ยืนยันตัวตนแล้ว</b>":" · รอตรวจใบหน้า")):"");
      if(m!=null&&running){
        var ev=DET.push(m,performance.now());
        st.textContent=DET.state==="stand"?"ยืน":"นั่ง";
        repEl.textContent=DET.reps;
        trk.style.width=(DET.reps/5*100)+"%";
        if(ev&&ev.event==="rep"){lastEvt=performance.now();
          coach.innerHTML="นับได้ "+ev.reps+" ครั้ง — นั่งลงให้สุดแล้วลุกต่อ<span class='statebadge'>"+(DET.state==="stand"?"ยืน":"นั่ง")+"</span>";
          setStatus("green","นับได้ "+ev.reps+" ครั้ง จาก 5 ครั้ง",false);
          /* ไม่ตัดเสียงนับครั้งก่อนหน้า ไม่งั้นลุกนั่งเร็ว ๆ จะได้ยินไม่ครบ */
          speak(["","หนึ่ง","สอง","สาม","สี่","ห้า"][ev.reps],{interrupt:false});}
        if(ev&&ev.event==="down")lastEvt=performance.now();
        if(ev&&ev.event==="finish"){finishTest(ev.elapsed);return}
      }else if(m!=null&&!running){
        var sitting=m<(S.draft.sitRef+S.draft.standRef)/2;
        st.textContent=sitting?"นั่ง":"ยืน";
        if(AUTOSTART&&!AUTOSTART.counting)
          setStatus(sitting?"green":"yellow",
            sitting?"เห็นท่านั่งแล้ว — เมื่อพร้อม ยกมือค้างไว้ หรือกดปุ่มเริ่ม":"กรุณานั่งลงบนเก้าอี้ก่อน",false);
        if(AUTOSTART)AUTOSTART.update(sitting&&q>=0.8);
      }
      if(q<0.8)coach.textContent="เห็นตัวไม่ครบ — ขยับมือถือให้เห็นทั้งตัว";
    }else{qual.innerHTML="คุณภาพภาพ <b>—</b>"}
    if(running){
      var el=(performance.now()-t0)/1000;clk.innerHTML=el.toFixed(1)+'<span style="font-size:13px"> วิ</span>';
      /* ตาข่ายนิรภัย: นับไม่ขึ้นเกิน 20 วินาที → แนะทางออก ไม่ปล่อยให้ติดค้าง */
      if(performance.now()-lastEvt>20000){
        coach.innerHTML="ระบบนับไม่ขึ้นใช่ไหม — ลอง<b>ลุกให้สุด นั่งให้ก้นแตะเก้าอี้</b> หรือกดปุ่มด้านล่างเพื่อกรอกเวลาเอง";
        setStatus("red","ระบบนับไม่ขึ้น — ลุกให้สุด นั่งให้สุด หรือกดปุ่มกรอกเวลาเอง");
        stopBtn.hidden=false;
      }
    }
    RAF=requestAnimationFrame(loop);
  }
  loop();
  /* เริ่มจับเวลาเองอัตโนมัติเมื่อผู้ใช้นั่งนิ่งพร้อม — ไม่ต้องเดินมากดปุ่ม */
  /* เดิม: เริ่มจับเวลาเองเมื่อนั่งนิ่ง → ผู้ใช้สะท้อนว่า "เริ่มทั้งที่ยังไม่พร้อม"
     ตอนนี้กล้องเห็นว่านั่งนิ่งแล้วก็นับถอยหลังเริ่มเอง ยกเลิกได้ทุกทาง
     และผู้ใช้สั่งเริ่มเองได้ก่อนด้วยการยกมือค้างไว้หรือกดปุ่ม */
  AUTOSTART=new AutoCapture({screen:"test",holdMs:2500,readyText:"นั่งพร้อมแล้ว",announce:true,
    abortOnLost:false,onFire:function(){
      cdStart({screen:S.screen,text:"เห็นว่านั่งพร้อมแล้ว",onFire:function(){beginTimer()}});
    }});
  rcStart();
  /* "บันทึก" กับ "เริ่ม" ทำอย่างเดียวกัน — ยกมือข้างเดียวหรือปุ่มรีโมตจึงเริ่มจับเวลาได้ทั้งคู่ */
  stepBegin({id:"ftsst",
    cue:"ลุกนั่ง ห้าครั้ง นั่งลงแล้วยกมือค้างไว้ หรือกดปุ่มเริ่ม",
    hint:"ยกมือค้างไว้ หรือกดปุ่มเริ่ม",
    on:{start:function(){cdCancel(true);beginTimer()},record:function(){cdCancel(true);beginTimer()},
        stop:function(){cdCancel(true);stepStop();if(running)stopBtn.click();else{rcStop();stopCam();go("assess")}}}});
  function beginTimer(){
    if(running)return;
    AUTOSTART.abort();AUTOSTART.done=true;
    running=true;t0=performance.now();lastEvt=t0;DET.start(t0);
    startBtn.textContent="กำลังจับเวลา…";startBtn.disabled=true;
    stopBtn.hidden=false;
    setStatus("green","เริ่มได้เลย — นาฬิกาจะเริ่มเดินเมื่อคุณเริ่มลุก",false);speak("เริ่มได้เลย");
    /* ระหว่างจับเวลารับแค่ หยุด (ยกสองมือ) — ท่าทางอื่นไม่ควรไปแตะอะไรกลางการวัด */
    stepBegin({id:"ftsstRun",cue:"",quiet:true,hint:"ยกสองมือค้างไว้ หรือกดปุ่มหยุด เพื่อเลิก",
      on:{stop:function(){stepStop();stopBtn.click()}}});
    coach.innerHTML="ลุกยืนให้สุดแล้วนั่งลงให้สุด ทำต่อเนื่อง<span class='statebadge'>เริ่มแล้ว</span>";
  }
  startBtn.addEventListener("click",function(){
    if(running)return;
    AUTOSTART.abort();
    beginTimer();
  });
  stopBtn.addEventListener("click",function(){
    var reps=DET?DET.reps:0;
    stopCam();
    audit("หยุดการทดสอบด้วยกล้องกลางคัน","ผู้ใช้หยุดเองขณะนับได้ "+reps+" ครั้ง แล้วเลือกกรอกเวลาเอง");
    askTime(function(n){
      S.draft.ftsst=n;S.draft.method="manual";S.draft.reps=5;S.draft.cv=null;S.draft.gaps=null;
      audit("บันทึกเวลาด้วยตนเอง","ผู้ใช้กรอกเวลา "+n.toFixed(1)+" วินาที");
      sectionDone("ftsst",{next:function(){go("tug")}});
    },function(){go("assess")});
  });
}
var TUG_ASK=null;
function finishTest(elapsed){
  stopCam();
  var gaps=[];
  for(var i=1;i<DET.stamps.length;i++)gaps.push((DET.stamps[i]-DET.stamps[i-1])/1000);
  var cv=null;
  if(gaps.length>1){
    var mean=gaps.reduce(function(a,b){return a+b},0)/gaps.length;
    var sd=Math.sqrt(gaps.reduce(function(a,b){return a+(b-mean)*(b-mean)},0)/gaps.length);
    cv=mean>0?sd/mean:null;
  }
  S.draft.ftsst=Math.round(elapsed*10)/10;
  S.draft.method="camera-pose";
  S.draft.reps=DET.reps;
  S.draft.cv=cv;
  S.draft.gaps=gaps.map(function(g){return Math.round(g*10)/10});
  /* สรุปผลยืนยันตัวตน: ผ่านเมื่อตรวจอย่างน้อย 1 ครั้งและไม่ตรงไม่เกิน 1 ครั้ง */
  var ck=S.draft.identityChecks||0, fl=S.draft.identityFails||0;
  S.draft.identityVerified=(faceEnabled()&&ck>=1&&fl<=1);
  audit("ผลการยืนยันตัวตนระหว่างทดสอบ", faceEnabled()
    ? ("ตรวจใบหน้า "+ck+" ครั้ง ไม่ตรง "+fl+" ครั้ง → "+(S.draft.identityVerified?"ยืนยันผ่าน":"ยืนยันไม่ผ่าน"))
    : "ผู้ใช้ไม่ได้ลงทะเบียนใบหน้า ผลนี้ไม่ได้ยืนยันตัวตน");
  audit("วัดด้วยกล้อง","ลุกนั่ง 5 ครั้งใน "+S.draft.ftsst.toFixed(1)+" วินาที · เวลาต่อครั้ง "+S.draft.gaps.join(", ")+" วินาที"+(cv!=null?" · ความแปรปรวน "+(cv*100).toFixed(0)+"%":""));
  speak("ครบห้าครั้ง เสร็จเรียบร้อย ใช้เวลา "+S.draft.ftsst.toFixed(0)+" วินาที เก่งมากค่ะ ขั้นตอนต่อไป ทดสอบการทรงตัว");
  toast("วัดเสร็จแล้ว "+S.draft.ftsst.toFixed(1)+" วินาที");
  if(PILOT){go("plog");return}
  setTimeout(function(){go("tug")},2400);
}
