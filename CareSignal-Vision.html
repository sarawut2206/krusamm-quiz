async function insurerV(){
  if(!S.roleAck){roleGateV("insurer","เจ้าหน้าที่บริษัทประกัน");return}
  head("บริษัทประกัน","ภาพรวมพอร์ต","ข้อมูลแบบแฝงชื่อ (pseudonymised) จากฐานข้อมูลกลาง ตามหลัก data minimization — ยังเป็นข้อมูลส่วนบุคคลตาม PDPA","assess");
  V.innerHTML='<div class="anim"><div class="card"><p class="sub" style="margin:0">กำลังอ่านฐานข้อมูล…</p></div></div>';
  var pool=await DB.listPool();
  if(!pool.length){
    V.innerHTML='<div class="anim"><div class="card"><p class="sub" style="margin:0 0 12px">ยังไม่มีข้อมูลในฐานข้อมูลกลาง</p>'+
    '<button class="ghostb" id="seed" style="margin:0">เติมข้อมูลสาธิต 10 ราย</button></div></div>';
    document.getElementById("seed").addEventListener("click",async function(){await seed();toast("เติมข้อมูลสาธิตแล้ว");render()});
    return;
  }
  var n=pool.length;
  var mix={4:0,3:0,2:0,1:0};pool.forEach(function(r){if(mix[r.tier]!==undefined)mix[r.tier]++});
  var cam=pool.filter(function(r){return r.method==="camera-pose"}).length;
  var ref=pool.filter(function(r){return r.referred}).length;
  var fts=pool.filter(function(r){return r.ftsst});
  var avgFt=fts.length?fts.reduce(function(a,b){return a+b.ftsst},0)/fts.length:null;
  var disc=pool.filter(function(r){return r.tier>=3}).length;   /* กลุ่มที่ผลอยู่ในเกณฑ์ดี */
  var mixRows=[4,3,2,1].map(function(k){var t=CFG.tiers[k];
    return '<div class="mixrow"><span class="lab">'+t.nm.split(" — ")[0]+'</span>'+
    '<span class="bar"><i style="width:'+(mix[k]/n*100)+'%;background:'+t.c+'"></i></span>'+
    '<span class="val">'+mix[k]+' ราย</span></div>'}).join("");
  V.innerHTML='<div class="anim">'+
  '<div class="kpis">'+
  '<div class="kpi"><div class="l">สมาชิกในพอร์ต</div><div class="n">'+n+' ราย</div></div>'+
  '<div class="kpi"><div class="l">วัดด้วยกล้อง</div><div class="n">'+Math.round(cam/n*100)+'%</div></div>'+
  '<div class="kpi"><div class="l">เวลาลุกนั่งเฉลี่ย</div><div class="n">'+(avgFt?avgFt.toFixed(1)+" วิ":"—")+'</div></div>'+
  '<div class="kpi"><div class="l">เข้าเกณฑ์ส่งต่อ</div><div class="n">'+ref+' ราย</div></div></div>'+
  '<div class="card"><h3>การกระจายระดับสัญญาณ</h3>'+mixRows+
  '<p class="sub" style="margin:10px 0 0">พอร์ตที่มีสัดส่วนเขียว-เหลืองสูง หมายถึงต้นทุนสินไหมคาดการณ์ต่ำกว่า — ผลของโปรแกรมป้องกันที่พ่วงกับกรมธรรม์</p></div>'+
  '<div class="card"><h3>ผลต่อการตั้งราคา</h3>'+
  '<div class="rowline"><span class="k">เข้าเกณฑ์ติดตามต่อเนื่อง</span><span class="v">'+disc+' ราย ('+Math.round(disc/n*100)+'%)</span></div>'+
  '<div class="rowline"><span class="k">ยังไม่เข้าเกณฑ์ (ไม่มีโทษ)</span><span class="v">'+(n-disc)+' ราย</span></div>'+
  '<p class="sub" style="margin:10px 0 0"><b>ไม่มีเส้นทางใดในระบบ</b>ที่นำผลตรวจไปเพิ่มเบี้ย ปฏิเสธความคุ้มครอง หรือปฏิเสธการเคลม — ออกแบบเพื่อไม่ลงโทษผู้ที่ประเมินตนเองอย่างซื่อสัตย์ เพราะข้อมูลที่ตรงความจริงคือสิ่งเดียวที่ทำให้การป้องกันได้ผล</p></div>'+
  '<div class="card"><h3>รายการในพอร์ต</h3>'+
  pool.slice(0,12).map(function(r){var t=CFG.tiers[r.tier]||{nm:"—",b:""};
    return '<div class="rowline"><span class="k">'+esc(r.uid.slice(0,10))+' · '+esc(r.ageBand||"—")+' · '+(r.sex==="f"?"ญ":"ช")+'</span>'+
    '<span class="v"><span class="pill '+t.b+'">'+t.nm.split(" — ")[0]+'</span></span></div>'}).join("")+'</div>'+
  '<button class="ghostb" id="seed2">เติมข้อมูลสาธิต 10 ราย (สำหรับการนำเสนอ)</button>'+
  '<div class="disc">รายงานนี้เป็นภาพรวมความเสี่ยงและการดูแลของพอร์ต — ระบบไม่คำนวณเบี้ยและไม่ตัดสินการจ่ายสินไหม</div></div>';
  document.getElementById("seed2").addEventListener("click",async function(){await seed();toast("เติมข้อมูลสาธิตแล้ว");render()});
}
async function seed(){
  var band=["50–59","60–69","60–69","70–79","50–59","60–69","80+","60–69","70–79","70–79"];
  var tiers=[4,4,3,2,4,3,1,4,3,2];
  var fts=[9.2,9.8,11.1,13.4,8.9,11.8,16.2,9.5,11.4,14.1];
  for(var i=0;i<10;i++){
    await DB.putPool({uid:"demo-"+String.fromCharCode(97+i),ageBand:band[i],sex:i%3===0?"m":"f",
      tier:tiers[i],score:tiers[i]===4?11:(tiers[i]===3?9:(tiers[i]===2?6:3)),ftsst:fts[i],
      lastAssess:new Date(Date.now()-i*3*864e5).toISOString(),nAssess:2+(i%3),
      level:tiers[i]===1?"urgent":(tiers[i]===2?"decline":(tiers[i]===3?"watch":"stable")),
      referred:tiers[i]<=2,method:"camera-pose",engine:ENGINE.version,demo:true,updated:nowISO()});
  }
}

      document.body.appendChild(o);
      o.querySelector("button").addEventListener("click",function(){o.remove()});
      o.addEventListener("click",function(e){if(e.target===o)o.remove()});
    });
  }

/* PWA: ลงทะเบียน Service Worker — ใช้ออฟไลน์ได้หลังเปิดครั้งแรก + แจ้งเมื่อมีเวอร์ชันใหม่ */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.register("./sw.js").then(function(reg){
    reg.addEventListener("updatefound",function(){
      var nw=reg.installing; if(!nw)return;
      nw.addEventListener("statechange",function(){
        if(nw.state==="installed"&&navigator.serviceWorker.controller){
          nw.postMessage("SKIP_WAITING");
          if(typeof toast==="function")toast("อัปเดตเป็นเวอร์ชันใหม่แล้ว — มีผลเมื่อเปิดครั้งถัดไป");
        }
      });
    });
  }).catch(function(){});
}
