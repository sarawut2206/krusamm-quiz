<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com https://tessdata.projectnaptha.com https://esm.sh https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<!-- ล็อก layout ไว้ที่ 430 หน่วยแล้วให้เบราว์เซอร์ขยายเต็มจอจริง —
     ทำให้ขนาดตัวอักษรเป็นสัดส่วนเดียวกันทุกเครื่อง แม้อุปกรณ์ที่ตั้งค่าการแสดงผล
     ให้รายงานจอกว้างผิดปกติ (เช่น 800+ CSS px) ก็ไม่ทำให้ตัวอักษรหดเล็ก -->
<meta name="viewport" content="width=430, viewport-fit=cover">
<meta name="description" content="วัดสมรรถภาพผู้สูงอายุด้วยกล้องมือถือ — นับลุกนั่ง 5 ครั้งอัตโนมัติ ประมวลผลในเครื่อง ไม่ส่งภาพออกไปที่ใด">
<title>CareSignal Vision — ตรวจจับสมรรถภาพด้วยกล้อง</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0F2A5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CareSignal">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6FB; --surf:#FFF; --surf2:#EAF0FE; --navy:#0F1B33;
  --ink:#16233B; --ink2:#5B6B84; --ink3:#93A1B7;
  --line:#DFE7F2; --line2:#EDF2FA;
  --brand:#2563EB; --brand2:#1D4ED8;
  --accent:#F59E0B; --accent2:#B45309; --accentb:#FEF3C7;
  --c4:#0E9F6E; --c3:#C79200; --c2:#D97706; --c1:#DC2626;
  --c4b:#E3F6EF; --c3b:#FEF6DE; --c2b:#FDECD8; --c1b:#FEE9E9;
  --sans:"Prompt","Noto Sans Thai",system-ui,sans-serif;
  --loop:"IBM Plex Sans Thai Looped","Prompt",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sh:0 1px 2px rgba(22,35,59,.04),0 8px 24px rgba(22,35,59,.06);
  --shx:0 2px 8px rgba(22,35,59,.08),0 24px 60px rgba(22,35,59,.13);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0B1220;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
  font-size:17px;line-height:1.7;display:flex;align-items:center;justify-content:center}
.phone{width:100%;max-width:430px;height:100dvh;background:var(--bg);position:relative;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shx)}
/* กรอบจำลองมือถือ — เฉพาะตอนเปิดในเบราว์เซอร์จอใหญ่เพื่อการนำเสนอ */
@media(min-width:520px) and (min-height:760px){.phone{border-radius:28px;height:880px;max-height:calc(100dvh - 40px)}}
/* เมื่อติดตั้งเป็นแอป (PWA standalone/fullscreen) ให้เต็มจอเสมอ ไม่ว่าอุปกรณ์จะรายงานจอกว้างเท่าใด */
@media(display-mode:standalone),(display-mode:fullscreen){
  body{display:block}
  .phone{max-width:none;max-height:none;width:100%;height:100dvh;border-radius:0;box-shadow:none}
}

/* หัวแถบ */
.bar{flex:none;background:linear-gradient(135deg,var(--brand2),var(--brand) 62%,#3B82F6);color:#fff;
  padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;position:relative}
.brandrow{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.bar .kick{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#FCD34D}
.bar h1{margin:3px 0 0;font-size:26px;letter-spacing:-.02em;font-weight:600;line-height:1.32}
.bar p{margin:7px 0 0;font-size:16.5px;color:rgba(255,255,255,.88);line-height:1.6}
.chip{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;font-family:var(--mono);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;background:rgba(245,158,11,.22);color:#FDE68A;padding:5px 10px;border-radius:99px}
.backb{background:rgba(255,255,255,.16);border:0;color:#fff;font-family:var(--sans);font-size:16.5px;
  padding:10px 18px;border-radius:99px;margin-bottom:10px;cursor:pointer;min-height:44px}

/* เนื้อหา */
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);-webkit-overflow-scrolling:touch}
.anim{animation:up .32s cubic-bezier(.2,.7,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.anim{animation:none}}

.card{background:var(--surf);border-radius:20px;padding:19px;box-shadow:var(--sh);margin-bottom:13px}
.card h3{margin:0 0 11px;font-size:20px;letter-spacing:-.01em;font-weight:600;line-height:1.45}
.sub{color:var(--ink2);font-size:17px;line-height:1.72}
.rowline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 0;border-top:1px solid var(--line2);font-size:17px}
.rowline:first-of-type{border-top:0}
.rowline .k{color:var(--ink2)}
.rowline .v{font-family:var(--mono);font-weight:600;text-align:right}
.cta{display:block;width:100%;border:0;border-radius:16px;background:var(--brand);color:#fff;font-family:var(--loop);
  font-size:21px;font-weight:600;padding:19px;cursor:pointer;margin-bottom:11px;transition:transform .1s;min-height:62px}
.cta:active{transform:scale(.985)}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.ghostb{display:block;width:100%;border:1px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);
  font-family:var(--sans);font-size:18px;padding:17px;cursor:pointer;margin-bottom:11px;min-height:58px}
.ghostb.danger{color:var(--c1);border-color:#F6CFCF}
.pill{display:inline-block;font-size:14.5px;font-weight:600;padding:5px 13px;border-radius:99px}
.t4{background:var(--c4b);color:var(--c4)}.t3{background:var(--c3b);color:var(--c3)}
.t2{background:var(--c2b);color:var(--c2)}.t1{background:var(--c1b);color:var(--c1)}

/* กล้อง — องค์ประกอบหลักของหน้าจอนี้ */
.stage{position:relative;border-radius:22px;overflow:hidden;background:#0B1220;aspect-ratio:3/4;margin-bottom:12px;box-shadow:var(--shx)}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage video{transform:scaleX(-1)}
.stage canvas{transform:scaleX(-1);pointer-events:none}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:14px}
.hudtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hudtag{background:rgba(11,18,32,.62);backdrop-filter:blur(8px);color:#fff;font-size:13.5px;padding:7px 12px;border-radius:99px;line-height:1.4}
.hudtag b{color:#FCD34D}
.hudbot{background:rgba(11,18,32,.68);backdrop-filter:blur(10px);border-radius:16px;padding:13px 15px;color:#fff}
.counter{display:flex;align-items:baseline;gap:10px}
.counter .n{font-family:var(--mono);font-size:46px;font-weight:600;line-height:1;letter-spacing:-.03em}
.counter .of{font-size:16px;color:rgba(255,255,255,.65)}
.counter .clock{margin-left:auto;font-family:var(--mono);font-size:27px;font-weight:600;color:#FCD34D}
.track{height:6px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;background:#FCD34D;border-radius:99px;transition:width .12s linear}
.coach{margin-top:9px;font-size:15px;color:rgba(255,255,255,.9);line-height:1.55;min-height:22px}
.statebadge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,255,255,.16);padding:3px 8px;border-radius:99px;margin-left:8px}

/* กราฟแนวโน้ม */
.bars{display:flex;align-items:flex-end;gap:8px;height:118px;padding-top:6px}
.bars .b{flex:1;border-radius:7px 7px 3px 3px;position:relative;min-height:10px;display:flex;align-items:flex-start;justify-content:center}
.bars .b span{font-family:var(--mono);font-size:11px;color:#fff;padding-top:4px;font-weight:600}
.barx{display:flex;gap:8px;margin-top:7px}
.barx div{flex:1;text-align:center;font-size:11px;color:var(--ink3)}

/* คำอธิบายเหตุผล */
.evi{border-left:4px solid var(--accent);background:var(--accentb);border-radius:0 12px 12px 0;padding:13px 15px;margin:9px 0;font-size:16.5px;line-height:1.68}
.evi .rid{display:block;font-family:var(--mono);font-size:12px;color:var(--accent2);letter-spacing:.08em;margin-bottom:4px}
.evi .why{display:block;color:var(--ink2);font-size:15px;margin-top:5px}
.disc{background:var(--line2);border-radius:12px;padding:13px 15px;font-size:15px;color:var(--ink2);line-height:1.68;margin-top:11px}

/* คำถามเสริม */
.pick{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surf);border-radius:14px;
  padding:20px 18px;font-family:var(--sans);font-size:19px;margin-bottom:11px;cursor:pointer;color:var(--ink);min-height:64px;line-height:1.45}
.pick:active{border-color:var(--brand);background:var(--surf2)}
.field{margin-bottom:15px}
.field label{display:block;font-size:16px;color:var(--ink2);margin-bottom:7px}
.field input{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:16px;font-family:var(--sans);font-size:19px;background:var(--surf);color:var(--ink)}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--surf);border-radius:13px;padding:16px;font-family:var(--sans);font-size:18px;cursor:pointer;color:var(--ink);min-height:58px}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--surf2);color:var(--brand2);font-weight:600}
.chk{display:flex;gap:12px;align-items:flex-start;background:var(--surf2);border-radius:14px;padding:16px;cursor:pointer;font-size:16px;line-height:1.65}
.chk input{width:28px;height:28px;flex:none;margin-top:1px;accent-color:var(--brand)}

/* เคส/ตาราง */
.case{border-top:1px solid var(--line2);padding:12px 0}
.case:first-of-type{border-top:0}
.case .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:5px}
.case .who{font-weight:600;font-size:16px}
.case .meta{font-size:13.5px;color:var(--ink2);line-height:1.6}
.mini{display:flex;gap:8px;margin-top:10px}
.mini button{flex:1;border:0;border-radius:12px;padding:13px;font-family:var(--sans);font-size:15px;cursor:pointer;font-weight:600;min-height:48px}
.ok{background:var(--c4);color:#fff}
.no{background:var(--line2);color:var(--ink2)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.kpi{background:var(--surf);border-radius:16px;padding:13px;box-shadow:var(--sh)}
.kpi .l{font-size:14px;color:var(--ink3);line-height:1.4}
.kpi .n{font-family:var(--mono);font-size:25px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.mixrow{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:15.5px}
.mixrow .lab{width:96px;color:var(--ink2)}
.mixrow .bar{flex:1;height:9px;background:var(--line2);border-radius:99px;overflow:hidden}
.mixrow .bar i{display:block;height:100%;border-radius:99px}
.mixrow .val{font-family:var(--mono);font-size:12px;width:40px;text-align:right}

/* แท็บล่าง */
.tabs{flex:none;display:flex;background:var(--surf);border-top:1px solid var(--line);padding:8px 6px calc(env(safe-area-inset-bottom) + 8px)}
.tabs button{flex:1;background:none;border:0;padding:9px 2px;font-family:var(--sans);font-size:13.5px;color:var(--ink3);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button[aria-selected="true"]{color:var(--brand);font-weight:600}
.tabs svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.toast{position:absolute;left:16px;right:16px;bottom:100px;background:var(--navy);color:#fff;border-radius:14px;padding:16px 18px;
  font-size:17px;line-height:1.55;opacity:0;transform:translateY(9px);transition:.25s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
@keyframes csPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.75}}
#statusLight.pulse{animation:csPulse 1.1s ease-in-out infinite}
/* เคารพผู้ใช้ที่ตั้งค่าลดการเคลื่อนไหว (WCAG 2.3.3) */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ============================================================
   กล้องเต็มจอ — ทุกหน้าที่วัดผ่านกล้อง
   วิดีโอเต็มหน้าจอ ไม่มีข้อความด้านบน สถานะและปุ่มทั้งหมดอยู่แถบล่าง
   ============================================================ */
/* ---------- กล้องครึ่งจอ ----------
   หน้ายืนยันใบหน้าต้องอ่านข้อความและติ๊กช่องยินยอมก่อนกด
   โหมดเต็มจอเดิมย้ายเฉพาะปุ่มลงแถบล่าง แต่ทิ้งช่องติ๊กไว้หลังกล้อง
   ผู้ใช้จึงติ๊กไม่ได้ ปุ่มบันทึกค้าง disabled = "ไม่มีปุ่มให้กด" */
body.camhalf{overflow:hidden}
body.camhalf .stage{position:fixed;top:0;left:0;right:0;height:46dvh;z-index:70;
  border-radius:0;aspect-ratio:auto;margin:0;box-shadow:none}
body.camhalf .stage video,body.camhalf .stage canvas{width:100%;height:100%;object-fit:cover}
body.camhalf .hudtop{top:8px}
body.camhalf .hudbot{display:none}
.camhalfpane{position:fixed;left:0;right:0;top:46dvh;bottom:0;z-index:72;overflow-y:auto;
  background:var(--bg);padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 24px rgba(11,18,32,.18);-webkit-overflow-scrolling:touch}
.camhalfpane .cta{margin:10px 0 0}
.camhalfpane .ghostb{margin:8px 0 0}
.camhalfpane .chk{display:flex;gap:11px;align-items:flex-start;font-size:15px;line-height:1.6;
  background:var(--surf2);border-radius:14px;padding:13px 15px;margin:0}
.camhalfpane .chk input{width:26px;height:26px;flex:none;margin-top:1px}
.vcline-retired{display:none;
  background:#EEF4FF;border:1px solid #CFE0FD;border-radius:12px;padding:10px 13px;margin:10px 0 0}
/* ---------- หน้ารวมหัวข้อ ---------- */
.sect{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  border:2px solid var(--line);background:var(--surf);border-radius:16px;
  padding:14px 16px;margin-bottom:10px;cursor:pointer;font-family:inherit;min-height:74px}
.sect .ic{font-size:26px;line-height:1;flex:none;width:34px;text-align:center}
.sect .tx{flex:1;min-width:0}
.sect .tx b{display:block;font-size:16.5px;margin-bottom:2px}
.sect .tx span{display:block;font-size:13.5px;color:var(--ink2);line-height:1.5}
.sect .st{flex:none;font-size:13px;font-weight:700;padding:5px 11px;border-radius:99px;white-space:nowrap}
.sect[data-st="done"]{border-color:var(--c4);background:var(--c4b)}
.sect[data-st="done"] .st{background:var(--c4);color:#fff}
.sect[data-st="skip"]{border-color:var(--c3)}
.sect[data-st="skip"] .st{background:var(--c3);color:#fff}
.sect[data-st="todo"] .st{background:var(--surf2);color:var(--ink3)}
.sect[data-st="next"]{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.sect[data-st="next"] .st{background:var(--brand);color:#fff}
.okcard{border:2px solid var(--c4);background:var(--c4b);border-radius:18px;padding:20px}
.okcard h3{color:var(--c4);margin:0 0 10px;font-size:19px}
.okcard .val{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ink)}
body.camfs{overflow:hidden}
body.camfs .stage{position:fixed;inset:0;z-index:70;border-radius:0;aspect-ratio:auto;margin:0;box-shadow:none;width:100vw;height:100vh;height:100dvh}
body.camfs .stage video,body.camfs .stage canvas{width:100%;height:100%;object-fit:cover}
body.camfs .hudtop{display:none}
.camdock{position:fixed;left:0;right:0;bottom:0;z-index:72;display:flex;flex-direction:column;gap:8px;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(11,18,32,0) 0%,rgba(11,18,32,.82) 34%,rgba(11,18,32,.94) 100%)}
.camdock .hudbot{background:transparent;backdrop-filter:none;border-radius:0;padding:0 0 2px}
.camdock #statusBar{margin:0}
.camdock .cta{margin:0;width:100%;padding:13px}
.camdock .btnrow{display:flex;gap:8px}
.camdock .btnrow .ghostb{margin:0;flex:1;width:auto;padding:11px 8px;font-size:13.5px}
.camdock .coach{font-size:13.5px;margin-top:4px}
.camdock #statusBar{padding:8px 12px;font-size:13px}
/* บีบทุกอย่างในแถบล่างให้เตี้ย — จอส่วนใหญ่ต้องเป็นภาพกล้อง */
.camdock{gap:6px}
.camdock .hudbot .counter .n{font-size:34px;line-height:1.05}
.camdock .hudbot .counter{margin:0}
.camdock .track{margin:5px 0 0;height:5px}
.camdock .bchips{margin:0 0 5px}
.camdock .bchips span{padding:4px 0;font-size:11.5px}
.camdock .ghostb{background:rgba(255,255,255,.10);color:#fff;border-color:rgba(255,255,255,.28)}
.bchips{display:flex;gap:6px;margin:0 0 8px}
.bchips span{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:5px 0;border-radius:9px;
  background:rgba(255,255,255,.14);color:#cbd5e1}
.bchips span.on{background:#F59E0B;color:#1a1300}
.bchips span.ok{background:#0E9F6E;color:#fff}
.bchips span.bad{background:#DC2626;color:#fff}

/* ---------- เมนูล่างขนาดใหญ่สำหรับผู้สูงอายุ ---------- */
.tabs{gap:8px;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px) !important;
  box-shadow:0 -6px 20px rgba(22,35,59,.08)}
.tabs button,.tabs .tab{
  flex:1;min-height:84px;border-radius:16px;
  background:var(--surf2,#EAF0FE);border:1.5px solid transparent;
  font-size:16px !important;line-height:1.25;font-weight:600;color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:10px 4px !important;transition:transform .12s,background .18s}
.tabs button b,.tabs .tab b{font-size:16px !important;font-weight:700;display:block}
.tabs button svg,.tabs .tab svg{width:32px !important;height:32px !important;stroke-width:1.9;margin:0 !important}
.tabs button:active,.tabs .tab:active{transform:scale(.96)}

<script>
"use strict";
var LOGO='<svg width="30" height="30" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="flex:none;color:#fff"><path d="M32 5C24.5 10 16.5 12.4 10 12.6V33c0 14 10 22.6 22 27 12-4.4 22-13 22-27V12.6C47.5 12.4 39.5 10 32 5Z" stroke="currentColor" stroke-width="4.2" stroke-linejoin="round"/><rect x="19.5" y="33" width="7" height="11" rx="3.5" fill="currentColor" opacity=".75"/><rect x="28.5" y="26" width="7" height="18" rx="3.5" fill="currentColor" opacity=".88"/><rect x="37.5" y="18" width="7" height="26" rx="3.5" fill="#FCD34D"/></svg>';

/* ============================================================
   ที่เก็บข้อมูล — คลาวด์แพลตฟอร์ม → เครื่องผู้ใช้ → หน่วยความจำ
   ============================================================ */
var MEM={};
var DB={
  mode:"temp",
  async get(k){
    if(window.storage){try{var r=await window.storage.get(k);this.mode="cloud";if(r)return JSON.parse(r.value)}catch(e){}}
    try{var s=localStorage.getItem("csv:"+k);if(this.mode!=="cloud")this.mode="local";if(s)return JSON.parse(s)}catch(e){}
    return MEM[k]||null;
  },
  async set(k,v){
    var s=JSON.stringify(v);MEM[k]=v;
    if(window.storage){try{await window.storage.set(k,s);this.mode="cloud";return}catch(e){}}
    try{localStorage.setItem("csv:"+k,s);this.mode="local"}catch(e){this.mode="temp"}
  },
  async del(k){
    if(window.storage){try{await window.storage.delete(k)}catch(e){}}
    try{localStorage.removeItem("csv:"+k)}catch(e){}
    delete MEM[k];
  },
  async putPool(rec){
    if(window.storage){try{await window.storage.set("pool:"+rec.uid,JSON.stringify(rec),true);return}catch(e){}}
    try{localStorage.setItem("csShared:pool:"+rec.uid,JSON.stringify(rec))}catch(e){}
  },
  async listPool(){
    var out=[];
    if(window.storage){
      try{
        var r=await window.storage.list("pool:",true);
        for(var i=0;i<(r.keys||[]).length;i++){try{var g=await window.storage.get(r.keys[i],true);if(g)out.push(JSON.parse(g.value))}catch(e){}}
        return out;
      }catch(e){}
    }
    try{for(var j=0;j<localStorage.length;j++){var k=localStorage.key(j);
      if(k&&k.indexOf("csShared:pool:")===0){try{out.push(JSON.parse(localStorage.getItem(k)))}catch(e){}}}}catch(e){}
    return out;
  }
};
function dbLabel(){
  var m;
  if(typeof CLOUD!=="undefined"&&CLOUD.session)m="DB · CLOUD ✓";
  else m="DB · "+(DB.mode==="cloud"?"CLOUD":(DB.mode==="local"?"LOCAL":"TEMP"));
  try{if(localStorage.getItem("csv:pilot")==="1")m+=" · โหมดวิจัย"}catch(e){}
  return m;
}

/* ============================================================
   ค่ากลาง — ชุดเดียวกับแอป เว็บ และโมเดลผู้ประกอบการ
   ============================================================ */
var CFG={
  /* ค่าตัดเกณฑ์จาก Poncumhak 2557 — 11.50 วินาทีสำหรับอายุ 65–74 ปี
     และ 12.10 วินาทีสำหรับ 75 ปีขึ้นไป · เดิมโค้ดแบ่งที่ 60 กับ 70
     ทำให้คนอายุ 70–74 ถูกใช้เกณฑ์ 12.1 ทั้งที่งานวิจัยบอกว่าควรเป็น 11.5
     คือปักธงต่ำกว่าหลักฐาน พลาดคนกลุ่มนั้นไป */
  ftsstCut:function(age){return age<65?10.0:(age<75?11.5:12.1);},
  /* ช่วงอายุมีสองงานที่ไม่เหมือนกัน เดิมใช้ฟังก์ชันเดียวทำทั้งคู่จึงผิดทั้งคู่
     ftsstBand — ป้ายกำกับเกณฑ์เวลาลุกนั่ง ต้องแบ่งตรงกับ ftsstCut คือ 60 และ 70
     ageBand   — ช่วงอายุสำหรับรายงานให้บริษัทประกัน ต้องครอบคลุมทุกอายุ
     ของเดิมจบที่ "66–70" แบบ catch-all ทำให้คนอายุ 72 หรือ 85 ถูกรายงานว่า 66–70
     ซึ่งผิดตรง ๆ สำหรับผลิตภัณฑ์ที่จับกลุ่มผู้สูงอายุ */
  ftsstBand:function(a){return a<65?"ต่ำกว่า 65 ปี":(a<75?"65–74 ปี":"75 ปีขึ้นไป");},
  ageBand:function(a){return a<60?"50–59":(a<70?"60–69":(a<80?"70–79":"80+"));},
  /* ตัวคูณเบี้ย แผนความคุ้มครอง และส่วนลด ถูกถอดออกทั้งหมด
     CareSignal เป็นแพลตฟอร์มประเมิน ติดตาม และประสานการดูแล
     ไม่คิดเบี้ย ไม่ออกแบบผลิตภัณฑ์ และไม่ตัดสินการจ่ายสินไหม */
  tiers:{
    4:{nm:"เขียว — แข็งแรงดี",c:"var(--c4)",b:"t4",act:"ออกกำลังต่อเนื่อง ประเมินซ้ำทุก 3 เดือน"},
    3:{nm:"เหลือง — เฝ้าระวัง",c:"var(--c3)",b:"t3",act:"ฝึกทรงตัวสัปดาห์ละ 3 วัน ประเมินซ้ำทุก 2 เดือน"},
    2:{nm:"ส้ม — เสี่ยงปานกลาง",c:"var(--c2)",b:"t2",act:"Care Manager ติดต่อภายใน 7 วัน"},
    1:{nm:"แดง — เสี่ยงสูง",c:"var(--c1)",b:"t1",act:"พยาบาลประเมินที่บ้านภายใน 72 ชม."}
  }
};
function fmt(n){return Math.round(n).toLocaleString("th-TH")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nowISO(){return new Date().toISOString()}
/* รหัสแฝงชื่อ (pseudonym) — ใช้แทนรหัสบัญชีจริงเมื่อส่งเข้าฐานข้อมูลกลาง
   หมายเหตุตามกฎหมาย: นี่คือการทำ pseudonymisation ไม่ใช่ anonymisation
   ข้อมูลที่ได้ยังเป็นข้อมูลส่วนบุคคลตาม PDPA เต็มที่ */
function pseudoId(s){
  var h=5381; s=String(s);
  for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0}
  return "P-"+("0000000"+h.toString(36).toUpperCase()).slice(-7);
}
function thDate(iso){return new Date(iso).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"})}
function thTime(iso){return new Date(iso).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
/* คำนวณอายุจากปีเกิด พ.ศ. (+เดือนเกิดถ้าระบุ) — เกณฑ์เวลากระโดดที่อายุ 60/70 พอดี
   จึงต้องไม่นับคนที่ยังไม่ถึงวันเกิดปีนี้ให้แก่เกินจริง */
function ageFrom(beYear,month){
  var now=new Date(), age=(now.getFullYear()+543)-beYear;
  if(month&&(now.getMonth()+1)<month)age--;
  return age;
}
var TH_MONTHS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

/* ============================================================
   ชั้นวิเคราะห์ท่าทาง — ประมวลผลบนเครื่อง ไม่ส่งภาพออกจากอุปกรณ์
   ------------------------------------------------------------
   ตัวชี้วัดหลัก: ตำแหน่งสะโพกเทียบสัดส่วนลำตัว
     M = (ระยะข้อเท้า−สะโพก) ÷ (ระยะข้อเท้า−ไหล่)
   เลือกอัตราส่วนแทนพิกัดดิบ เพราะไม่ขึ้นกับระยะห่างจากกล้อง
   ส่วนสูงของผู้ใช้ หรือการวางมือถือสูงต่ำ
   ============================================================ */
var LM={LSH:11,RSH:12,LHIP:23,RHIP:24,LKNEE:25,RKNEE:26,LANK:27,RANK:28,LHEEL:29,RHEEL:30,LTOE:31,RTOE:32};

function midY(lm,a,b){return (lm[a].y+lm[b].y)/2}
function visOK(lm){
  var need=[LM.LSH,LM.RSH,LM.LHIP,LM.RHIP,LM.LKNEE,LM.RKNEE,LM.LANK,LM.RANK];
  var seen=0;
  for(var i=0;i<need.length;i++){var v=lm[need[i]];if(v&&(v.visibility===undefined||v.visibility>0.5))seen++}
  return seen/need.length;
}
function hipRatio(lm){
  var sh=midY(lm,LM.LSH,LM.RSH), hip=midY(lm,LM.LHIP,LM.RHIP), ank=midY(lm,LM.LANK,LM.RANK);
  var span=ank-sh;
  if(!isFinite(span)||Math.abs(span)<0.02)return null;
  return (ank-hip)/span;
}
function kneeAngle(lm){
  function ang(h,k,a){
    var v1={x:lm[h].x-lm[k].x,y:lm[h].y-lm[k].y}, v2={x:lm[a].x-lm[k].x,y:lm[a].y-lm[k].y};
    var d=v1.x*v2.x+v1.y*v2.y, m=Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y);
    if(!m)return null;
    return Math.acos(Math.max(-1,Math.min(1,d/m)))*180/Math.PI;
  }
  var l=ang(LM.LHIP,LM.LKNEE,LM.LANK), r=ang(LM.RHIP,LM.RKNEE,LM.RANK);
  if(l==null&&r==null)return null;
  if(l==null)return r; if(r==null)return l;
  return (l+r)/2;
}

/* ---- ตัวนับจำนวนครั้ง: เครื่องสถานะพร้อม hysteresis กันการนับซ้ำจากการสั่น ---- */
function RepDetector(opts){
  opts=opts||{};
  this.sitRef=null; this.standRef=null;
  this.state="idle"; this.reps=0; this.stamps=[]; this.t0=null; this.done=false;
  this.target=opts.target||5;
  this.upFrac=opts.upFrac!==undefined?opts.upFrac:0.68;
  this.downFrac=opts.downFrac!==undefined?opts.downFrac:0.36;
  this.buf=[]; this.smoothN=opts.smoothN||5;
  /* จุดเริ่มจับเวลาจริง — เมื่อร่างกายเริ่มขยับลุกครั้งแรก ไม่ใช่ตอนกดปุ่ม
     มาตรฐาน FTSST จับเวลาตั้งแต่เริ่มเคลื่อนไหวจนลุกครบ 5 ครั้ง
     ถ้านับตั้งแต่กดปุ่ม เวลาที่นั่งรอจะถูกบวกเข้าไปด้วย ทำให้ผลแย่กว่าจริง */
  this.onsetFrac=opts.onsetFrac!==undefined?opts.onsetFrac:0.18;
  this.moveStart=null;
}
RepDetector.prototype.smooth=function(v){
  this.buf.push(v); if(this.buf.length>this.smoothN)this.buf.shift();
  var s=0; for(var i=0;i<this.buf.length;i++)s+=this.buf[i];
  return s/this.buf.length;
};
RepDetector.prototype.setRefs=function(sit,stand){this.sitRef=sit;this.standRef=stand};
RepDetector.prototype.start=function(t){this.state="sit";this.reps=0;this.stamps=[];this.t0=t;this.done=false;this.buf=[];this.moveStart=null};
/* เวลาที่ใช้จริง นับจากจังหวะเริ่มขยับ ไม่ใช่จากตอนกดปุ่ม */
RepDetector.prototype.elapsedAt=function(t){
  var base=this.moveStart!=null?this.moveStart:this.t0;
  return (t-base)/1000;
};
RepDetector.prototype.thresholds=function(){
  var range=this.standRef-this.sitRef;
  return {up:this.sitRef+range*this.upFrac, down:this.sitRef+range*this.downFrac, range:range};
};
RepDetector.prototype.push=function(raw,t){
  if(this.done||this.state==="idle"||this.sitRef==null||this.standRef==null)return null;
  var v=this.smooth(raw), th=this.thresholds();
  /* จับจังหวะ "เริ่มขยับลุก" ครั้งแรก → นาฬิกาเริ่มเดินตรงนี้
     ใช้เกณฑ์ต่ำ (18% ของช่วงนั่ง-ยืน) เพื่อจับตั้งแต่เริ่มโน้มตัวไปข้างหน้า */
  if(this.moveStart===null&&this.state==="sit"&&v>=this.sitRef+th.range*this.onsetFrac){
    this.moveStart=t;
    return {event:"onset"};
  }
  if(this.state==="sit"&&v>=th.up){
    if(this.moveStart===null)this.moveStart=t;   /* กันกรณีลุกเร็วจนข้ามเกณฑ์เริ่มขยับ */
    this.state="stand"; this.reps++; this.stamps.push(t);
    if(this.reps>=this.target){this.done=true;return{event:"finish",reps:this.reps,elapsed:this.elapsedAt(t)}}
    return {event:"rep",reps:this.reps};
  }
  if(this.state==="stand"&&v<=th.down){this.state="sit";return{event:"down",reps:this.reps}}
  return null;
};

/* ============================================================
   คะแนนและการวิเคราะห์แนวโน้ม
   ============================================================ */
function ftsstPoints(sec,age){
  var cut=CFG.ftsstCut(age);
  if(sec==null)return 0;
  return sec<=cut?4 : sec<=cut+2?3 : sec<=cut+4.5?2 : sec<=60?1 : 0;
}

/* ============================================================
   ระบบวงจรปิด v2 — คัดกรอง → จัดระดับ → แผน → ติดตาม → ส่งต่อ → วัดผล
   ============================================================ */

/* ---------- Safety Gate: ถามก่อนให้ทำการทดสอบกายภาพ ----------
   เหตุผล: เดิมระบบให้ผู้สูงอายุลุกนั่ง 5 ครั้งและยืนขาเดียวโดยไม่ถาม
   ว่าวันนี้มีอาการอันตรายหรือไม่ ซึ่งเสี่ยงทั้งต่อผู้ใช้และต่อโครงการ
   ข้อ 1–4 เป็น red flag ถ้าตอบ "มี" ต้องหยุดและส่งต่อ ไม่ใช่ให้ทดสอบต่อ */
var SAFETY_Q=[
  {k:"faint",  q:"วันนี้มีอาการหน้ามืด เวียนศีรษะมาก หรือเหมือนจะเป็นลมหรือไม่",
   o:[["ไม่มี",0],["ไม่แน่ใจ",1],["มี",2]], red:2},
  {k:"chest",  q:"วันนี้มีอาการเจ็บหน้าอก หายใจลำบากผิดปกติ หรือใจสั่นรุนแรงหรือไม่",
   o:[["ไม่มี",0],["มี",2]], red:2},
  {k:"stroke", q:"มีอาการอ่อนแรงเฉียบพลัน หน้าเบี้ยว พูดไม่ชัด หรือแขนขาชาหรือไม่",
   o:[["ไม่มี",0],["มี",2]], red:2},
  {k:"injury", q:"เพิ่งหกล้ม บาดเจ็บ ผ่าตัด หรือแพทย์ห้ามเดิน/ลงน้ำหนักหรือไม่",
   o:[["ไม่มี",0],["มี",2]], red:2},
  {k:"helper", q:"ขณะทำการทดสอบ มีผู้ดูแลอยู่ใกล้ ๆ หรือไม่",
   o:[["มี",0],["ไม่มี",1]], red:9}   /* ไม่ใช่ red flag แต่บันทึกไว้ */
];
function safetyVerdict(ans){
  var reds=[];
  SAFETY_Q.forEach(function(q){ if(ans[q.k]!=null && ans[q.k]>=q.red)reds.push(q.k) });
  var alone = ans.helper===1;
  return {safe:reds.length===0, reds:reds, alone:alone,
          urgent:reds.indexOf("chest")>=0||reds.indexOf("stroke")>=0};
}

/* คะแนนความเสี่ยงจากยา: กลุ่มเสี่ยงสูง(2) นับหนัก กลุ่มเสี่ยงปานกลาง(1) นับเบา */
function fridScore(purposes){
  var high=0, mod=0;
  (purposes||[]).forEach(function(k){
    var g=FRID_GROUPS.filter(function(x){return x.k===k})[0];
    if(!g)return; if(g.frid===2)high++; else if(g.frid===1)mod++;
  });
  return {high:high, mod:mod, total:high*2+mod};
}

/* ============================================================
   Baseline Risk Stratification — ทำงานได้ตั้งแต่การประเมินครั้งแรก
   ------------------------------------------------------------
   ช่องว่างเดิมที่แก้ตรงนี้: เอนจินเดิมเทียบกับอดีตของตัวเองอย่างเดียว
   ผู้ใช้ครั้งแรกจึงได้ "คงที่" เสมอ แม้จะล้ม 3 ครั้งและลุกเองไม่ได้
   ตอนนี้มีสองชั้นทำงานคู่กัน: baseline (ค่าสัมบูรณ์) + trajectory (เทียบตัวเอง)
   ระดับสุดท้ายใช้อันที่แย่กว่า
   ============================================================ */
function baselineRisk(d, age){
  var reds=[], yellows=[];
  var f=d.fallsDetail||{}, m=d.medsDetail||{};
  var fc=f.count;

  /* ---- แดง ---- */
  if(fc!=null&&fc>=2&&fc!==9) reds.push({id:"B1",text:"หกล้มตั้งแต่ 2 ครั้งขึ้นไปใน 12 เดือน",
    why:"การล้มซ้ำเป็นตัวทำนายการล้มครั้งถัดไปที่ชัดที่สุด"});
  if(f.injury!=null&&f.injury>=2) reds.push({id:"B2",text:"ล้มแล้วบาดเจ็บจนต้องพบแพทย์หรือเข้าโรงพยาบาล",
    why:"การล้มที่มีการบาดเจ็บบ่งชี้ความรุนแรงและความเสี่ยงกระดูกหักซ้ำ"});
  if(f.loc!=null&&f.loc>=1) reds.push({id:"B3",text:"ล้มแล้วหมดสติหรือจำเหตุการณ์ไม่ได้",
    why:"อาจไม่ใช่เรื่องการทรงตัว แต่เป็นภาวะหมดสติที่ต้องหาสาเหตุทางหัวใจหรือสมอง"});
  if(f.getup!=null&&f.getup>=3) reds.push({id:"B4",text:"ล้มแล้วลุกขึ้นเองไม่ได้",
    why:"บ่งชี้กำลังกล้ามเนื้อไม่พอ และเสี่ยงนอนติดพื้นนานหากล้มขณะอยู่คนเดียว"});
  if(d.notTested) reds.push({id:"B5",text:"ไม่สามารถทำการทดสอบกายภาพได้อย่างปลอดภัย",
    why:"มีอาการที่ต้องได้รับการประเมินโดยบุคลากรก่อน จึงยังไม่ควรทดสอบเอง"});
  var fs=(m.summary&&m.summary.high!=null)?m.summary:fridScore(m.purposes);   /* pipeline ให้ค่าตรงกว่าวัตถุประสงค์ */
  if(fs.high>=2 && (d.balance!=null&&d.balance<=1))
    reds.push({id:"B6",text:"ใช้ยากลุ่มเสี่ยงสูงตั้งแต่ 2 กลุ่ม ร่วมกับการทรงตัวบกพร่อง",
      why:"ยากลุ่มกดประสาทหลายชนิดร่วมกับการทรงตัวที่ไม่ดี เพิ่มความเสี่ยงแบบทวีคูณ"});

  /* ---- เหลือง ---- */
  if(fc===1) yellows.push({id:"B7",text:"หกล้ม 1 ครั้งใน 12 เดือน",
    why:"ล้มครั้งแรกเพิ่มโอกาสล้มซ้ำใน 12 เดือนถัดไปอย่างชัดเจน"});
  /* B15 — อันตรายในบ้าน (เอนจินต้องเท่ากับแอปสมาชิก แม้หน้านี้ไม่ถาม) */
  if(d.homeDetail&&d.homeDetail.hazards){
    var hz=d.homeDetail.hazards.length, alone=d.homeDetail.helper==="alone";
    if(hz>=3||(hz>=1&&alone))
      yellows.push({id:"B15",text:"พบอันตรายในบ้าน "+hz+" ข้อ"+(alone?" และอยู่คนเดียว":""),
        why:"CDC STEADI ระบุให้ประเมินและแก้ไขสิ่งแวดล้อมในบ้าน เป็นมาตรการที่ได้ผลเร็วที่สุด"});
  }
  if(d.steadi&&(d.steadi.unsteady||d.steadi.worried))
    yellows.push({id:"B8",text:"รู้สึกไม่มั่นคงขณะเดิน หรือกังวลว่าจะล้ม",
      why:"ความรู้สึกของเจ้าตัวเป็นสัญญาณคัดกรองที่ CDC STEADI ใช้เป็นข้อแรก"});
  if(d.ftsst!=null&&d.ftsst>CFG.ftsstCut(age))
    yellows.push({id:"B9",text:"เวลาลุกนั่งสูงกว่าเกณฑ์ของช่วงอายุ",
      why:"สะท้อนกำลังกล้ามเนื้อขาส่วนล่างที่ลดลง"});
  if(d.tug!=null&&d.tug>=12&&d.tugDistanceOk!==false)
    yellows.push({id:"B10",text:"ลุกเดิน 3 เมตรใช้เวลาตั้งแต่ 12 วินาที",
      why:"เกณฑ์คัดกรองของ CDC STEADI"});
  if(d.balPassed!=null&&d.balPassed<3)
    yellows.push({id:"B11",text:"ยืนต่อเท้าไม่ครบ 10 วินาที",
      why:"หนึ่งในสัญญาณเสี่ยงตามชุดคัดกรอง 4-Stage Balance Test"});
  if(m.count!=null&&m.count>=2&&m.count!==9)
    yellows.push({id:"B12",text:"ใช้ยาประจำตั้งแต่ 4 รายการขึ้นไป",
      why:"การใช้ยาหลายชนิดสัมพันธ์กับความเสี่ยงหกล้มที่สูงขึ้น"});
  if(fs.total>=2)
    yellows.push({id:"B13",text:"ใช้ยาในกลุ่มที่อาจเพิ่มความเสี่ยงหกล้ม",
      why:"ควรให้เภสัชกรหรือแพทย์ทบทวนรายการยา ไม่ควรปรับหรือหยุดยาเอง"});
  if(m.changed&&m.changed.length&&m.changed.indexOf("none")<0&&
     m.symptoms&&m.symptoms.length&&m.symptoms.indexOf("none")<0)
    yellows.push({id:"B14",text:"เพิ่งปรับยาแล้วมีอาการเวียนหัว ง่วง หรือเดินเซ",
      why:"อาการหลังปรับยาเป็นช่วงที่ความเสี่ยงหกล้มสูงที่สุด"});

  var level = reds.length?"urgent" : (yellows.length?"watch":"stable");
  return {level:level, reds:reds, yellows:yellows, flags:reds.concat(yellows)};
}

/* ============================================================
   คะแนนสมรรถภาพ — 9 คะแนน (ไม่รวมการทรงตัว)
   ------------------------------------------------------------
   การทรงตัว 4 ท่าถูกถอดออกจากคะแนนหลักโดยตั้งใจ เพราะผลผ่าน/ไม่ผ่าน
   มาจากการยืนยันของคน ไม่ใช่การวัดอัตโนมัติที่เทียบเคียงกันได้ทุกครั้ง
   การเอาค่าที่คนตัดสินไปรวมกับค่าที่เครื่องจับเวลา ทำให้คะแนนรวม
   ตีความยากและเปรียบเทียบข้ามครั้งไม่ได้จริง

   ผลการทรงตัวยังถูกเก็บและแสดงในหน้าเคสเสมอ (parts.balance / balPassed)
   และยังเปิดสัญญาณ S4 ได้ แต่ไม่คิดเป็นคะแนน — เป็น "ข้อมูลเสริม
   ที่ผู้ดูแลยืนยัน" ตามที่ตกลงไว้
   ค่าตัดระดับปรับตามฐานใหม่: 8/9 · 6/9 · 4/9 (สัดส่วนเดิมของฐาน 12)
   ============================================================ */
function scoreOf(d,age){
  var parts={ftsst:ftsstPoints(d.ftsst,age), falls:d.falls==null?0:d.falls,
              meds:d.meds==null?0:d.meds, adl:d.adl==null?0:d.adl,
              balance:d.balance||0};   /* เก็บไว้แสดง แต่ไม่บวกเข้าคะแนน */
  var s=parts.ftsst+parts.falls+parts.meds+parts.adl;
  return {score:s, max:9, tier:s>=8?4:s>=6?3:s>=4?2:1, parts:parts, balanceInScore:false};
}

       เกิดกับผู้ใช้ครั้งแรกที่มีอันตรายในบ้านและไม่ติดกฎอื่น — บั๊กที่ถูกปลดล็อกโดยการแก้บั๊กก่อนหน้า */
    B15:{nm:"พบอันตรายในบ้านหลายข้อ หรือมีร่วมกับการอยู่คนเดียว",src:"CDC STEADI — การประเมินและแก้ไขสิ่งแวดล้อมในบ้านเป็นมาตรการที่มีหลักฐานว่าลดการหกล้ม"}
  },
  cadence:{stable:90,watch:45,decline:21,urgent:7},
  levelNm:{stable:"คงที่",watch:"เฝ้าสังเกต",decline:"ถดถอย",urgent:"ต้องดูแลเร่งด่วน"},
  levelColor:{stable:"var(--c4)",watch:"var(--c3)",decline:"var(--c2)",urgent:"var(--c1)"}
};

/* ============================================================
   ชั้นสัญญาณหลัก 7 ประเภท (S1–S7)
   ------------------------------------------------------------
   กฎ 25 ข้อยังอยู่ครบในฐานะ "หลักฐาน" ที่อธิบายได้ว่าทำไมถึงติด
   แต่สิ่งที่ส่งต่อไปยังขั้นถัดไปของสายงานคือ "สัญญาณ" 7 ประเภทนี้
   เพราะแต่ละสัญญาณผูกกับ "งานที่ต้องเกิดขึ้นจริง" คนละแบบ —
   ล้มซ้ำต้องพบแพทย์ · ยาเสี่ยงต้องให้เภสัชกรทบทวน · เดินช้าลง
   ต้องเข้าโปรแกรมฝึกกำลังขาและการทรงตัว

   ถ้าไม่มีชั้นนี้ ระบบจะบอกได้แค่ "เหลือง/แดง" ซึ่งไม่พอให้ใคร
   ลงมือทำอะไรได้ — และนั่นคือความต่างระหว่างแบบสอบถามกับ
   ระบบประสานการดูแลก่อนเกิดการเคลม

   ระบบนี้ไม่วินิจฉัยโรค ไม่สั่งหยุด/ลด/เพิ่มยา ไม่ตัดสินการเคลม
   ทุกการตัดสินใจทางคลินิกเป็นของบุคลากรที่มีใบอนุญาต
   ============================================================ */
var SIGNAL_DEFS=[
  {k:"S1", nm:"หกล้มครั้งใหม่", rules:["R3","B7"],
   dest:"doctor",     act:"ทบทวนสาเหตุการล้มกับแพทย์ และสำรวจจุดเสี่ยงในบ้าน"},
  {k:"S2", nm:"หกล้มซ้ำหรือล้มแล้วบาดเจ็บ", rules:["B1","B2","B3","B4"],
   dest:"doctor",     act:"พบแพทย์เพื่อหาสาเหตุ — การล้มซ้ำและการหมดสติไม่ใช่เรื่องของการฝึกทรงตัวอย่างเดียว"},
  {k:"S3", nm:"ความเสี่ยงจากยา", rules:["R5","B6","B12","B13","B14"],
   dest:"pharmacist", act:"ให้เภสัชกรหรือแพทย์ทบทวนรายการยา — ระบบไม่สั่งหยุดหรือปรับยาเอง"},
  {k:"S4", nm:"กำลังขาและการทรงตัวถดถอย", rules:["R1","R2","R4","R7","R8","B9","B11"],
   dest:"physio",     act:"เข้าโปรแกรมฝึกกำลังขาและการทรงตัว (strength and balance)"},
  {k:"S5", nm:"ความคล่องตัวในการเดินลดลง", rules:["R10","B10"],
   dest:"physio",     act:"ประเมินการเดินและพิจารณาอุปกรณ์ช่วยเดินที่เหมาะสม"},
  {k:"S6", nm:"ทำกิจวัตรประจำวันได้น้อยลง", rules:["R6","R9"],
   dest:"nurse",      act:"ประเมินภาวะพึ่งพิงเชิงลึกและวางแผนการดูแลร่วมกับครอบครัว"},
  {k:"S7", nm:"ธงแดงด้านความปลอดภัย", rules:["B5","B8","B15"],
   dest:"doctor",     act:"ให้บุคลากรประเมินก่อน ยังไม่ควรทดสอบสมรรถภาพด้วยตนเอง"}
];
/* แปลงกฎที่ติดทั้งหมด → สัญญาณหลักพร้อมความรุนแรงและงานที่ต้องทำ */
function toSignals(flags){
  var byRule={};
  (flags||[]).forEach(function(f){ byRule[f.id]=f });
  var out=[];
  SIGNAL_DEFS.forEach(function(d){
    var hit=d.rules.filter(function(r){return byRule[r]});
    if(!hit.length)return;
    var sev=0, why=[];
    hit.forEach(function(r){ sev=Math.max(sev,byRule[r].sev||1); why.push(byRule[r].text) });
    out.push({k:d.k, nm:d.nm, sev:sev, dest:d.dest, act:d.act, rules:hit, why:why});
  });
  out.sort(function(a,b){return b.sev-a.sev});
  return out;
}
var DEST_NM={doctor:"แพทย์",pharmacist:"เภสัชกร",physio:"นักกายภาพบำบัด",
             nurse:"พยาบาล/ผู้จัดการดูแล",family:"ครอบครัว",community:"เครือข่ายชุมชน"};
/* วงจรชีวิตของเคสก่อนการเคลม — ต้องตรงกับ enum cs_case_status ในฐานข้อมูล */
var CASE_FLOW=[
  {k:"new",          nm:"เคสใหม่ ยังไม่มีผู้รับผิดชอบ"},
  {k:"reviewing",    nm:"เจ้าหน้าที่รับเคสแล้ว กำลังทบทวน"},
  {k:"contacted",    nm:"ติดต่อผู้เอาประกันหรือครอบครัวได้แล้ว"},
  {k:"referred",     nm:"ส่งต่อผู้เชี่ยวชาญแล้ว"},
  {k:"intervention", nm:"อยู่ระหว่างการดูแลแก้ไข"},
  {k:"follow_up_due",nm:"ถึงกำหนดติดตามผล"},
  {k:"stable",       nm:"ดีขึ้นหรือคงที่ — ปิดเคส"},
  {k:"closed",       nm:"ปิดเคสด้วยเหตุอื่น"}
];
function caseNm(k){for(var i=0;i<CASE_FLOW.length;i++)if(CASE_FLOW[i].k===k)return CASE_FLOW[i].nm;return k}
/* เส้นทางการส่งต่อ — ตามได้จนถึงผลลัพธ์ ไม่ใช่แค่ "แนะนำแล้วจบ" */
var REF_FLOW=[
  {k:"recommended",     nm:"ระบบแนะนำให้ส่งต่อ"},
  {k:"approved",        nm:"บุคลากรยืนยันการส่งต่อ"},
  {k:"acknowledged",    nm:"ผู้เอาประกันรับทราบแล้ว"},
  {k:"booked",          nm:"นัดหมายเรียบร้อย"},
  {k:"completed",       nm:"ไปพบผู้เชี่ยวชาญแล้ว"},
  {k:"outcome_recorded",nm:"บันทึกผลลัพธ์แล้ว"},
  {k:"declined",        nm:"ปฏิเสธการส่งต่อ"},
  {k:"unreachable",     nm:"ติดต่อไม่ได้"}
];
function refNm(k){for(var i=0;i<REF_FLOW.length;i++)if(REF_FLOW[i].k===k)return REF_FLOW[i].nm;return k}

function hasADLFlag(out){return out.flags.some(function(f){return f.id==="R6"})}
function trajectory(){
  var A=S.data.assessments, p=S.data.profile;
  if(!A.length||!p)return null;
  var last=A[A.length-1], first=A[0];
  var out={n:A.length,last:last,flags:[],level:"stable",span:daysBetween(first.at,last.at),
           sinceLast:daysBetween(last.at,nowISO())};
  var fts=A.filter(function(x){return x.ftsst!=null});
  var bestFt=fts.length?Math.min.apply(null,fts.map(function(x){return x.ftsst})):null;
  var bestScore=Math.max.apply(null,A.map(function(x){return x.score}));

  if(last.ftsst!=null&&bestFt!=null&&fts.length>1&&last.ftsst>bestFt){
    var d=last.ftsst-bestFt, pct=d/bestFt*100;
    if(d>=2.3||pct>=15){
      out.flags.push({id:"R1",sev:(pct>=30||d>=4)?2:1,
        text:"เวลาลุกนั่ง 5 ครั้งช้าลง "+pct.toFixed(0)+"% ("+bestFt.toFixed(1)+" → "+last.ftsst.toFixed(1)+" วินาที) เทียบกับผลที่ดีที่สุดของคุณเอง",
        why:"ส่วนต่าง "+d.toFixed(1)+" วินาที ถึงเกณฑ์การเปลี่ยนแปลงที่มีความหมายทางคลินิก (≥2.3 วินาที)"});
    }
  }
  if(last.ftsst!=null){
    var cut=CFG.ftsstCut(p.age), prevFt=null;
    for(var i=A.length-2;i>=0;i--){if(A[i].ftsst!=null){prevFt=A[i].ftsst;break}}
    if(last.ftsst>cut&&(prevFt==null||prevFt<=cut)){
      out.flags.push({id:"R2",sev:2,
        text:"เวลาลุกนั่งขึ้นเป็น "+last.ftsst.toFixed(1)+" วินาที สูงกว่าเกณฑ์ของช่วงอายุ "+CFG.ftsstBand(p.age)+" ("+cut.toFixed(1)+" วินาที)",
        why:"เป็นการข้ามค่าตัดเกณฑ์ครั้งแรก จึงถือเป็นการเปลี่ยนสถานะ ไม่ใช่ความผันผวนปกติ"});
    }
  }
  if(A.length>1){
    var prev=A[A.length-2];
    if(last.parts.falls<prev.parts.falls)
      out.flags.push({id:"R3",sev:2,text:"มีการหกล้มเกิดขึ้นใหม่ในช่วง "+daysBetween(prev.at,last.at)+" วันที่ผ่านมา",
        why:"ผู้ที่ล้มแล้ว 1 ครั้งมีโอกาสล้มซ้ำสูงขึ้นชัดเจนใน 12 เดือนถัดไป"});
    if(last.parts.adl<prev.parts.adl)
      out.flags.push({id:"R6",sev:3,text:"ความสามารถทำกิจวัตรประจำวันลดลงจากการประเมินครั้งก่อน",
        why:"การลดลงของ ADL เป็นสัญญาณเริ่มต้นของภาวะพึ่งพิง ซึ่งเป็นเหตุการณ์ที่กรมธรรม์คุ้มครอง"});
  }
  if(last.score<=bestScore-2)
    out.flags.push({id:"R4",sev:last.score<=bestScore-3?2:1,
      text:"คะแนนรวมลดลง "+(bestScore-last.score)+" คะแนน จากค่าดีที่สุดของคุณ ("+bestScore+" → "+last.score+")",
      why:"เปรียบเทียบกับตัวคุณเองในอดีต ไม่ใช่กับค่าเฉลี่ยของคนอื่น"});
  if(last.parts.meds===0&&last.parts.balance<=1)
    out.flags.push({id:"R5",sev:2,text:"ใช้ยาตั้งแต่ 4 ชนิดขึ้นไป ร่วมกับผลทรงตัวที่ยังไม่ผ่านเกณฑ์",
      why:"สองปัจจัยนี้เมื่อเกิดร่วมกันเพิ่มความเสี่ยงหกล้มมากกว่าผลรวมของแต่ละปัจจัย"});
  /* กฎเฉพาะของการวัดด้วยกล้อง: ความสม่ำเสมอของจังหวะแต่ละครั้ง */
  if(last.cv!=null&&last.cv>=0.25)
    out.flags.push({id:"R7",sev:1,
      text:"จังหวะการลุกแต่ละครั้งไม่สม่ำเสมอ (ครั้งท้าย ๆ ช้ากว่าครั้งแรกอย่างชัดเจน)",
      why:"กล้องวัดเวลาแยกรายครั้งได้ ความแปรปรวน "+(last.cv*100).toFixed(0)+"% บ่งชี้ความล้าของกล้ามเนื้อขาเร็วกว่าปกติ"});

  /* R8 — การทรงตัวถดถอยเป็นรายท่า (CDC 4-Stage Balance Test)
     เหตุผลที่ต้องแยกจาก R4: คะแนนรวมอาจไม่ขยับเลยเพราะช่วงคะแนนทรงตัวหยาบ
     แต่การที่เคยยืนต่อเท้าได้ครบ 10 วินาทีแล้ววันนี้ทำไม่ได้ คือการสูญเสียที่ชัดเจน */
  var bals=A.filter(function(x){return x.balPassed!=null});
  if(last.balPassed!=null&&bals.length>1){
    var bestBal=Math.max.apply(null,bals.map(function(x){return x.balPassed}));
    if(last.balPassed<bestBal){
      var lostN=bestBal-last.balPassed;
      out.flags.push({id:"R8",sev:(last.balPassed<=1||lostN>=2)?2:1,
        text:"การทรงตัวถดถอย "+lostN+" ท่า — เคยยืนผ่าน "+bestBal+" จาก 4 ท่า ครั้งนี้ผ่าน "+last.balPassed+" ท่า"+
             (BAL_STAGES[last.balPassed]?" (ท่าที่ทำไม่ได้: "+BAL_STAGES[last.balPassed].nm+")":""),
        why:"ท่ายืนของ 4-Stage Balance Test เรียงจากง่ายไปยาก การทำท่าที่เคยผ่านไม่ได้ จึงเป็นการสูญเสียความสามารถ ไม่ใช่ความผันผวนของการวัด"});
    }
  }
  /* R9 — คะแนนบาร์เธลลดลงแม้ยังอยู่ระดับเดิม
     เหตุผล: R6 จับเฉพาะตอนข้ามระดับ (ติดสังคม → ติดบ้าน) ซึ่งช้าเกินไป
     คนที่ตกจาก 20 เหลือ 14 คะแนน ยังเป็น "ติดสังคม" อยู่ แต่เสียความสามารถไป 6 คะแนนแล้ว */
  var bars=A.filter(function(x){return x.barthelTotal!=null});
  if(last.barthelTotal!=null&&bars.length>1){
    var bestBar=Math.max.apply(null,bars.map(function(x){return x.barthelTotal}));
    var dBar=bestBar-last.barthelTotal;
    if(dBar>=2&&!hasADLFlag(out))
      out.flags.push({id:"R9",sev:dBar>=4?2:1,
        text:"คะแนนดัชนีบาร์เธลลดลง "+dBar+" คะแนน ("+bestBar+" → "+last.barthelTotal+" จาก 20) โดยยังไม่ข้ามระดับ",
        why:"เป็นการเตือนล่วงหน้าก่อนจะตกไปสู่ระดับพึ่งพิงที่สูงขึ้น ซึ่งเป็นจุดที่กรมธรรม์เริ่มจ่ายสินไหม"});
  }

  /* R10 — TUG ช้ากว่าเกณฑ์คัดกรอง CDC (12 วินาที นับตั้งแต่เริ่มลุกจนนั่งลง)
     ใช้เฉพาะรอบที่ระบบยืนยันว่าเดินครบระยะ 3 เมตร มิฉะนั้นเวลาจะสั้น/ยาวเกินจริง */
  if(last.tug!=null&&last.tug>=12&&last.tugDistanceOk!==false)
    out.flags.push({id:"R10",sev:last.tug>=15?2:1,
      text:"ลุกเดิน 3 เมตรแล้วกลับมานั่ง ใช้เวลา "+last.tug.toFixed(1)+" วินาที (เกณฑ์คัดกรอง 12 วินาที)",
      why:"CDC STEADI ใช้ 12 วินาทีเป็นจุดคัดกรองความเสี่ยงหกล้ม — เป็นจุดเริ่มเฝ้าระวัง ไม่ใช่คำวินิจฉัย"});

  /* ---------- รวมชั้น Baseline เข้ากับชั้น Trajectory ----------
     Baseline ใช้ค่าสัมบูรณ์ ทำงานได้ตั้งแต่การประเมินครั้งแรก
     Trajectory เทียบกับอดีตของตัวเอง ต้องมีอย่างน้อย 2 ครั้ง
     ระดับสุดท้ายใช้อันที่แย่กว่า เพื่อไม่ให้ผู้ใช้ครั้งแรกที่ล้มซ้ำ
     ได้สถานะเขียวเพียงเพราะยังไม่มีประวัติให้เทียบ */
  /* ต้องส่งทุกฟิลด์ที่ baselineRisk ใช้ — ลืมฟิลด์ใดฟิลด์หนึ่ง กฎที่พึ่งฟิลด์นั้น
     จะเงียบหายไปทั้งที่เขียนไว้แล้ว (เคยเกิดกับ homeDetail → กฎ B15 ไม่เคยติดเลย) */
  var bl=baselineRisk({
    fallsDetail:last.fallsDetail, medsDetail:last.medsDetail, steadi:last.steadi,
    homeDetail:last.homeDetail,
    ftsst:last.ftsst, tug:last.tug, tugDistanceOk:last.tugDistanceOk,
    balPassed:last.balPassed, balance:last.parts?last.parts.balance:null,
    notTested:last.notTested
  }, p.age);
  out.baseline=bl;
  bl.reds.forEach(function(f){ out.flags.push({id:f.id,sev:3,text:f.text,why:f.why,baseline:true}) });
  bl.yellows.forEach(function(f){ out.flags.push({id:f.id,sev:1,text:f.text,why:f.why,baseline:true}) });

  var sev=out.flags.reduce(function(a,b){return a+b.sev},0);
  var hasADL=out.flags.some(function(f){return f.id==="R6"});
  var byRules = (last.tier===1||hasADL||sev>=5)?"urgent" : (last.tier===2||sev>=3)?"decline" : sev>=1?"watch":"stable";
  var ORD={stable:0,watch:1,decline:2,urgent:3}, NM=["stable","watch","decline","urgent"];
  out.level = NM[Math.max(ORD[byRules], ORD[bl.level])];   /* ใช้อันที่แย่กว่าเสมอ */
  out.byRules=byRules;
  /* ชั้นสัญญาณ: สิ่งที่ส่งต่อไปเปิดเคสและกำหนดปลายทางการส่งต่อ */
  out.signals=toSignals(out.flags);
  out.opensCase=(out.level!=="stable");     /* เหลือง/ส้ม/แดง = ต้องมีคนรับผิดชอบ */
  out.nextDays=ENGINE.cadence[out.level];
  out.nextDate=new Date(Date.now()+out.nextDays*864e5).toISOString();
  out.referral = out.level==="urgent"?{nm:"ส่งต่อพยาบาลประเมินที่บ้าน",sla:"ภายใน 72 ชั่วโมง",need:true}
               : out.level==="decline"?{nm:"Care Manager โทรติดตาม",sla:"ภายใน 7 วัน",need:true}
               : out.level==="watch"?{nm:"แผนป้องกันด้วยตนเอง + เตือนประเมินซ้ำ",sla:"ไม่ต้องส่งต่อ",need:false}
                                     :{nm:"ดูแลตนเองตามแผนปกติ",sla:"ไม่ต้องส่งต่อ",need:false};
  return out;

/* สรุปสถิติตาม KPI ของการตรวจสอบเครื่องมือวัด */
function pilotStats(){
  var a=PLOG.all();
  var done=a.filter(function(r){return r.csTime!=null});
  var withRef=done.filter(function(r){return r.ref1!=null});
  var errs=withRef.map(function(r){return r.csTime-r.ref1});
  var abs=errs.map(function(e){return Math.abs(e)});
  function mean(x){return x.length?x.reduce(function(p,c){return p+c},0)/x.length:null}
  var m=mean(errs), sd=null;
  if(errs.length>1){sd=Math.sqrt(errs.reduce(function(p,c){return p+(c-m)*(c-m)},0)/(errs.length-1))}
  var repsOK=done.filter(function(r){return r.repsCorrect===true}).length;
  var fails=a.filter(function(r){return r.techFail}).length;
  var people={};a.forEach(function(r){if(r.pid)people[r.pid]=1});
  /* ความแปรปรวนเมื่อวัดซ้ำ: ส่วนเบี่ยงเบนของแต่ละคนที่วัด ≥2 รอบ */
  var byP={};done.forEach(function(r){if(!byP[r.pid])byP[r.pid]=[];byP[r.pid].push(r.csTime)});
  var retest=[];
  Object.keys(byP).forEach(function(k){
    var v=byP[k]; if(v.length<2)return;
    var mu=mean(v);
    retest.push(Math.sqrt(v.reduce(function(p,c){return p+(c-mu)*(c-mu)},0)/(v.length-1)));
  });
  return {
    n:a.length, nDone:done.length, nPeople:Object.keys(people).length, nRef:withRef.length,
    completion:a.length?done.length/a.length*100:null,
    repAcc:done.length?repsOK/done.length*100:null,
    mae:mean(abs), bias:m, sd:sd,
    techFailRate:a.length?fails/a.length*100:null,
    retestSD:mean(retest), nRetest:retest.length,
    setupMean:mean(done.filter(function(r){return r.setupSec}).map(function(r){return r.setupSec}))
  };
}
function pilotCSV(){
  var cols=["trial","participant","trial_no","datetime","method","cs_time_s","ref1_s","ref2_s",
            "error1_s","error2_s","cs_reps","reps_correct","cadence_cv","gaps_s",
            "sit_ref","stand_ref","setup_sec","tech_fail","notes"];
  var rows=PLOG.all().map(function(r,i){
    return [i+1, r.pid||"", r.trialNo||"", r.at||"", r.method||"",
      r.csTime!=null?r.csTime.toFixed(2):"", r.ref1!=null?r.ref1.toFixed(2):"", r.ref2!=null?r.ref2.toFixed(2):"",
      (r.csTime!=null&&r.ref1!=null)?(r.csTime-r.ref1).toFixed(2):"",
      (r.csTime!=null&&r.ref2!=null)?(r.csTime-r.ref2).toFixed(2):"",
      r.reps!=null?r.reps:"", r.repsCorrect===true?"1":(r.repsCorrect===false?"0":""),
      r.cv!=null?(r.cv).toFixed(4):"", r.gaps?r.gaps.join(" "):"",
      r.sitRef!=null?r.sitRef.toFixed(4):"", r.standRef!=null?r.standRef.toFixed(4):"",
      r.setupSec!=null?r.setupSec:"", r.techFail?"1":"0",
      (r.notes||"").replace(/[",\n]/g," ")];
  });
  return "﻿"+[cols].concat(rows).map(function(r){return r.join(",")}).join("\n");
}

    (opts.body?'<p style="margin:0 0 18px;font-size:18px;line-height:1.7;color:#5B6B84">'+opts.body+'</p>':'')+
    (opts.input?'<input id="dlgIn" inputmode="decimal" placeholder="'+esc(opts.placeholder||"")+'" style="width:100%;box-sizing:border-box;font-size:30px;font-family:inherit;padding:16px;border:1.5px solid #DFE7F2;border-radius:14px;text-align:center;margin-bottom:14px;color:#16233B">':'')+
    '<button id="dlgOk" style="display:block;width:100%;border:0;border-radius:14px;padding:19px;font-size:20px;font-weight:600;font-family:inherit;cursor:pointer;background:'+(opts.danger?"#DC2626":"#2563EB")+';color:#fff">'+esc(opts.ok||"ตกลง")+'</button>'+
    '<button id="dlgNo" style="display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-family:inherit;cursor:pointer;background:transparent;color:#5B6B84;margin-top:6px">'+esc(opts.cancel||"ยกเลิก")+'</button></div>';
  document.body.appendChild(wrap);
  var inp=document.getElementById("dlgIn");
  var prevFocus=document.activeElement;
  setTimeout(function(){(inp||document.getElementById("dlgOk")).focus()},60);
  function onKey(e){if(e.key==="Escape"){close();if(opts.onCancel)opts.onCancel()}}
  document.addEventListener("keydown",onKey);
  function close(){wrap.remove();document.removeEventListener("keydown",onKey);if(prevFocus&&prevFocus.focus)try{prevFocus.focus()}catch(e){}}
  document.getElementById("dlgNo").addEventListener("click",function(){close();if(opts.onCancel)opts.onCancel()});
  document.getElementById("dlgOk").addEventListener("click",function(){
    if(opts.input){opts.onOk(parseFloat(inp.value))}
    else{close();opts.onOk()}
  });
  if(inp)inp.addEventListener("keydown",function(e){if(e.key==="Enter")opts.onOk(parseFloat(inp.value))});
  return {close:close};
}

/* ============================================================
   ออกจากระบบ
   ------------------------------------------------------------
   แยกสองกรณีให้ชัด เพราะผลลัพธ์ต่างกันมาก:
   - บัญชีที่เชื่อมระบบกลางแล้ว: ข้อมูลอยู่บนเซิร์ฟเวอร์ ออกได้ปลอดภัย
     ล้างสำเนาในเครื่องทิ้งเพื่อไม่ให้คนถัดไปที่ใช้เครื่องนี้เห็นข้อมูล
     แล้วเข้าใหม่ด้วยเบอร์กับรหัส 4 หลักได้ทุกเมื่อ
   - บัญชีออฟไลน์ (ไม่ได้กรอกเบอร์ตอนสมัคร): ข้อมูลมีที่นี่ที่เดียว
     ออกจากระบบ = ลบทิ้งถาวร จึงต้องเตือนตรง ๆ ก่อน ไม่ใช่ปล่อยให้
     กดแล้วข้อมูลหายโดยไม่รู้ตัว
   ============================================================ */
function logoutFlow(){
  var cloud = (typeof CLOUD!=="undefined" && CLOUD.session);
  dialog({
    title: cloud ? "ออกจากระบบ" : "ออกจากระบบ (บัญชีออฟไลน์)",
    body: cloud
      ? "ข้อมูลของท่าน<b>ยังอยู่บนระบบกลาง</b> เข้าใหม่ด้วยเบอร์โทรและรหัส 4 หลักได้ทุกเมื่อ<br><br>ระบบจะล้างสำเนาข้อมูลในเครื่องนี้ เพื่อไม่ให้คนถัดไปที่ใช้เครื่องนี้เห็นข้อมูลของท่าน"
      : "บัญชีนี้<b>ไม่ได้เชื่อมกับระบบกลาง</b> ข้อมูลทั้งหมดอยู่ในเครื่องนี้ที่เดียว<br><br><b style=\"color:var(--c1)\">หากออกจากระบบตอนนี้ ผลตรวจทั้งหมดจะหายถาวร กู้คืนไม่ได้</b><br><br>หากต้องการเก็บข้อมูลไว้ ให้กดยกเลิก แล้วสมัครใหม่พร้อมกรอกเบอร์โทรเพื่อเชื่อมระบบกลางก่อน",
    ok: cloud ? "ออกจากระบบ" : "ออกจากระบบ และลบข้อมูลในเครื่อง",
    cancel: "ยกเลิก · ใช้งานต่อ",
    danger: !cloud,
    onOk: async function(){
      audit("ออกจากระบบ", cloud ? "ผู้ใช้ออกจากระบบ · ข้อมูลยังอยู่บนระบบกลาง"
                                : "ผู้ใช้ออกจากระบบบัญชีออฟไลน์ · ข้อมูลในเครื่องถูกลบ");
      if(cloud){ try{ await CSBackend.signOut() }catch(e){} }
      if(typeof CLOUD!=="undefined"){ CLOUD.session=false; }
      try{ clearFaceSig() }catch(e){}
      try{ await DB.del("visionData") }catch(e){}
      S.data=blank(); S.draft={};
      stopCam();
      toast(cloud ? "ออกจากระบบแล้ว" : "ออกจากระบบและลบข้อมูลในเครื่องแล้ว");
      go("welcome");
    }
  });
}
